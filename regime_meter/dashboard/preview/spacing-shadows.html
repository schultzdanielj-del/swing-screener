<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
  <div class="swatch-block">
    <div style="height:80px;background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg-secondary);">Popover · dropdown</div>
    <div class="meta"><div class="name">--shadow-popover</div><div class="hex">0 8px 24px rgba(0,0,0,0.45)</div></div>
  </div>
  <div class="swatch-block">
    <div style="height:80px;background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg-secondary);">Modal · dialog</div>
    <div class="meta"><div class="name">--shadow-modal</div><div class="hex">0 24px 60px rgba(0,0,0,0.55)</div></div>
  </div>
</div></body></html>

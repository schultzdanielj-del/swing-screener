<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanPerfect</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090b; --surface: #0f1114; --surface-2: #151719; --surface-3: #1b1d21;
      --border: #232529; --border-bright: #35373d;
      --text: #e8eaed; --text-dim: #9ca0a8; --text-muted: #62656d;
      --green: #34d399; --green-dark: #059669; --green-bg: rgba(52,211,153,0.07);
      --red: #f87171; --red-dark: #dc2626; --red-bg: rgba(248,113,113,0.07);
      --amber: #fbbf24; --amber-bg: rgba(251,191,36,0.07);
      --blue: #60a5fa; --blue-bg: rgba(96,165,250,0.07);
      --cyan: #22d3ee; --purple: #a78bfa;
      --mono: 'JetBrains Mono', monospace; --sans: 'DM Sans', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans); }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border-bright); border-radius:3px; }
    ::-webkit-scrollbar-track { background:transparent; }

    /* ── Layout ─────────────────────── */
    .app { display:flex; height:100vh; }
    .rail {
      width:52px; min-width:52px; background:var(--surface);
      border-right:1px solid var(--border); display:flex; flex-direction:column;
      align-items:center; padding:12px 0; gap:4px;
    }
    .rail-logo { font-family:var(--mono); font-size:9px; font-weight:700; color:var(--blue);
      letter-spacing:1px; margin-bottom:16px; writing-mode:vertical-rl; text-orientation:mixed;
      transform:rotate(180deg); }
    .rail-btn {
      width:36px; height:36px; border-radius:6px; border:none; background:transparent;
      color:var(--text-muted); cursor:pointer; font-size:16px; transition:all 0.12s;
      display:flex; align-items:center; justify-content:center;
    }
    .rail-btn:hover { background:var(--surface-2); color:var(--text-dim); }
    .rail-btn.on { background:var(--blue-bg); color:var(--blue); }
    .rail-agent {
      margin-top:auto; width:8px; height:8px; border-radius:50%; background:var(--red-dark);
      transition:background 0.4s;
    }
    .rail-agent.online { background:var(--green); box-shadow:0 0 8px rgba(52,211,153,0.4); }

    .sidebar {
      width:220px; min-width:220px; background:var(--surface);
      border-right:1px solid var(--border); display:flex; flex-direction:column;
      overflow-y:auto;
    }
    .sb-hdr {
      padding:14px 16px 10px; font-family:var(--mono); font-size:11px; font-weight:600;
      letter-spacing:0.5px; color:var(--text); border-bottom:1px solid var(--border);
    }
    .sb-section { padding:8px 0; }
    .sb-label {
      padding:4px 16px; font-family:var(--mono); font-size:9px; font-weight:600;
      letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted);
    }
    .sb-item {
      padding:7px 16px; cursor:pointer; font-family:var(--mono); font-size:11px;
      color:var(--text-dim); transition:all 0.08s; border-left:2px solid transparent;
      display:flex; align-items:center; gap:8px;
    }
    .sb-item:hover { background:var(--surface-2); color:var(--text); }
    .sb-item.on { background:var(--surface-2); color:var(--blue); border-left-color:var(--blue); }
    .sb-item .num {
      font-size:9px; font-weight:700; width:16px; height:16px; border-radius:3px;
      background:var(--surface-3); color:var(--text-muted); display:flex;
      align-items:center; justify-content:center; flex-shrink:0;
    }
    .sb-item.on .num { background:var(--blue-bg); color:var(--blue); }

    .sb-setup-sel {
      display:flex; gap:4px; padding:8px 16px;
    }
    .sb-setup-btn {
      flex:1; padding:6px; border:1px solid var(--border); border-radius:4px;
      background:transparent; color:var(--text-dim); font-family:var(--mono);
      font-size:10px; font-weight:600; cursor:pointer; transition:all 0.1s;
    }
    .sb-setup-btn:hover { border-color:var(--text-muted); color:var(--text); }
    .sb-setup-btn.on { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); }

    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .main-hdr {
      padding:12px 24px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .main-title { font-family:var(--mono); font-size:14px; font-weight:600; }
    .main-title span { color:var(--text-muted); font-weight:400; }
    .main-body { flex:1; overflow-y:auto; padding:20px 24px; }

    /* ── Components ─────────────────── */
    .card {
      background:var(--surface); border:1px solid var(--border); border-radius:8px;
      padding:16px 20px; margin-bottom:12px;
    }
    .card-title {
      font-family:var(--mono); font-size:11px; font-weight:600;
      letter-spacing:0.5px; color:var(--text-dim); margin-bottom:10px;
    }
    .badge {
      font-family:var(--mono); font-size:9px; font-weight:700; padding:2px 7px;
      border-radius:3px; letter-spacing:0.5px; text-transform:uppercase;
    }
    .b-done { color:var(--green); background:var(--green-bg); }
    .b-running { color:var(--amber); background:var(--amber-bg); animation:blink 1.5s infinite; }
    .b-pending { color:var(--text-muted); background:var(--surface-3); }
    .b-error { color:var(--red); background:var(--red-bg); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .pulse-dot { animation: pulse 1.5s ease-in-out infinite; }

    .btn {
      font-family:var(--mono); font-size:11px; font-weight:600;
      padding:7px 16px; border:1px solid var(--border-bright); border-radius:5px;
      cursor:pointer; transition:all 0.1s; background:var(--surface-2); color:var(--text-dim);
    }
    .btn:hover:not(:disabled) { background:var(--surface-3); color:var(--text); }
    .btn:disabled { opacity:0.3; cursor:not-allowed; }
    .btn-go { background:var(--green-dark); border-color:var(--green); color:#fff; }
    .btn-go:hover:not(:disabled) { background:var(--green); }
    .btn-stop { background:var(--red-dark); border-color:var(--red); color:#fff; }

    .stat-row { display:flex; gap:16px; flex-wrap:wrap; }
    .stat-box {
      background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
      padding:12px 16px; min-width:120px; flex:1;
    }
    .stat-label { font-family:var(--mono); font-size:9px; color:var(--text-muted);
      letter-spacing:0.8px; text-transform:uppercase; margin-bottom:4px; }
    .stat-val { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); }
    .stat-val.green { color:var(--green); }
    .stat-val.amber { color:var(--amber); }
    .stat-val.blue { color:var(--blue); }

    .log-box {
      background:var(--bg); border:1px solid var(--border); border-radius:6px;
      padding:12px 16px; font-family:var(--mono); font-size:11px; line-height:1.55;
      color:var(--text-dim); max-height:400px; overflow-y:auto; white-space:pre-wrap;
    }
    .log-box .ok { color:var(--green); font-weight:500; }
    .log-box .err { color:var(--red); }

    .empty-state {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      height:300px; color:var(--text-muted); font-family:var(--mono); font-size:12px;
      gap:8px;
    }
    .empty-state .icon { font-size:32px; opacity:0.3; }

    /* ── Examples grid ──────────────── */
    .ex-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px; }
    .ex-card {
      background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
      padding:10px 12px; cursor:default; transition:border-color 0.1s;
    }
    .ex-card:hover { border-color:var(--border-bright); }
    .ex-ticker { font-family:var(--mono); font-size:13px; font-weight:700; }
    .ex-date { font-family:var(--mono); font-size:10px; color:var(--text-muted); }
    .ex-card.rejected { border-left:3px solid var(--red-dark); opacity:0.6; }

    /* ── Vetting ────────────────────── */
    .vet-layout { display:flex; height:calc(100vh - 110px); margin:-20px -24px; }
    .vet-list {
      width:260px; min-width:260px; border-right:1px solid var(--border);
      overflow-y:auto; background:var(--surface);
    }
    .vet-item {
      padding:8px 14px; cursor:pointer; border-bottom:1px solid rgba(35,37,41,0.5);
      transition:background 0.08s; border-left:3px solid transparent;
    }
    .vet-item:hover { background:var(--surface-2); }
    .vet-item.on { background:var(--surface-2); border-left-color:var(--blue); }
    .vet-item.v-yes { border-left-color:var(--green); }
    .vet-item.v-maybe { border-left-color:var(--amber); }
    .vet-item.v-no { border-left-color:var(--red); opacity:0.5; }
    .vet-ticker { font-family:var(--mono); font-size:12px; font-weight:700; }
    .vet-meta { font-family:var(--mono); font-size:10px; color:var(--text-muted); display:flex; justify-content:space-between; }
    .vet-adr { color:var(--green); font-weight:600; }

    .vet-chart { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .vet-chart-hdr {
      padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .vet-chart-info { display:flex; align-items:center; gap:14px; }
    .vet-chart-ticker { font-family:var(--mono); font-size:18px; font-weight:700; }
    .vet-chart-meta { font-family:var(--mono); font-size:10px; color:var(--text-dim); }
    .vet-btns { display:flex; gap:6px; align-items:center; }
    .vet-btn {
      padding:7px 18px; border:2px solid; border-radius:5px; font-family:var(--mono);
      font-size:12px; font-weight:700; cursor:pointer; background:transparent; transition:all 0.12s;
    }
    .vet-btn.yes { color:var(--green); border-color:var(--green); }
    .vet-btn.yes:hover,.vet-btn.yes.sel { background:var(--green); color:#000; }
    .vet-btn.maybe { color:var(--amber); border-color:var(--amber); }
    .vet-btn.maybe:hover,.vet-btn.maybe.sel { background:var(--amber); color:#000; }
    .vet-btn.no { color:var(--red); border-color:var(--red); }
    .vet-btn.no:hover,.vet-btn.no.sel { background:var(--red); color:#fff; }
    .vet-canvas-area { flex:1; position:relative; }

    .vet-filter-bar {
      display:flex; gap:6px; padding:6px 14px; background:var(--surface-2);
      border-bottom:1px solid var(--border);
    }
    .vet-filter-btn {
      padding:3px 9px; border-radius:3px; border:1px solid var(--border);
      background:transparent; color:var(--text-muted); cursor:pointer;
      font-family:var(--mono); font-size:9px; font-weight:600;
    }
    .vet-filter-btn.on { background:var(--blue); color:#fff; border-color:var(--blue); }

    .kbd-hint {
      position:fixed; bottom:10px; right:14px; font-family:var(--mono); font-size:9px;
      color:var(--text-muted); background:var(--surface); padding:5px 10px;
      border-radius:4px; border:1px solid var(--border); z-index:100;
    }
    kbd { background:var(--surface-2); border:1px solid var(--border); border-radius:2px;
      padding:1px 4px; font-size:9px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = '';

// ═══════════════════════════════════════════════════════
// SHARED HELPERS
// ═══════════════════════════════════════════════════════
function ema(data, period) {
  const k = 2/(period+1), r = new Array(data.length).fill(null); let p = null;
  for (let i=0;i<data.length;i++) { if(data[i]==null) continue; if(p==null){p=data[i];r[i]=p;} else{p=data[i]*k+p*(1-k);r[i]=p;}} return r;
}
function sma(data, period) {
  const r = new Array(data.length).fill(null);
  for(let i=period-1;i<data.length;i++){let s=0,c=0;for(let j=i-period+1;j<=i;j++){if(data[j]!=null){s+=data[j];c++;}}if(c===period)r[i]=s/c;} return r;
}
function fmtDur(s) { if(s<60) return `${Math.round(s)}s`; if(s<3600) return `${Math.floor(s/60)}m ${Math.round(s%60)}s`; return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`; }

// ═══════════════════════════════════════════════════════
// NIGHTLY REFRESH PAGE
// ═══════════════════════════════════════════════════════
function NightlyPage() {
  const [pipe, setPipe] = useState(null);
  const [logs, setLogs] = useState([]);
  const logRef = useRef(null);
  const logCountRef = useRef(0);

  useEffect(() => {
    const load = () => fetch(`${API}/api/pipeline/steps`).then(r=>r.json()).then(setPipe).catch(()=>{});
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (!pipe) return;
    const step = pipe.steps.find(s => s.id === 'nightly');
    if (!step || !['running','claimed','queued'].includes(step.state?.status)) { logCountRef.current = 0; return; }
    const poll = () => fetch(`${API}/api/pipeline/logs/nightly?after=${logCountRef.current}`).then(r=>r.json())
      .then(d => { if(d.lines?.length) { logCountRef.current += d.lines.length; setLogs(p=>[...p,...d.lines]); } }).catch(()=>{});
    poll(); const id = setInterval(poll, 2000); return () => clearInterval(id);
  }, [pipe?.steps?.find(s=>s.id==='nightly')?.state?.status]);

  useEffect(() => { if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [logs]);

  const nightly = pipe?.steps?.find(s => s.id === 'nightly');
  const st = nightly?.state?.status || 'pending';
  const isRun = ['running','claimed','queued'].includes(st);

  function doRun() {
    fetch(`${API}/api/pipeline/run/nightly`, {method:'POST'}).then(r=>r.json()).then(d => {
      if(d.error) alert(d.error); else { setLogs([]); }
    });
  }
  function doReset() { fetch(`${API}/api/pipeline/reset/nightly`, {method:'POST'}); }

  return (
    <div>
      <div className="stat-row" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">Status</div>
          <div className={`stat-val ${st==='done'?'green':st==='running'?'amber':''}`}>{st.toUpperCase()}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Last Run</div>
          <div className="stat-val" style={{fontSize:13}}>{nightly?.state?.finished_at ? new Date(nightly.state.finished_at).toLocaleString() : '—'}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Duration</div>
          <div className="stat-val" style={{fontSize:13}}>{nightly?.state?.duration_s ? fmtDur(nightly.state.duration_s) : '—'}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Agent</div>
          <div className={`stat-val ${pipe?.agent_status==='online'?'green':'amber'}`} style={{fontSize:13}}>
            {pipe?.agent_status?.toUpperCase() || '?'}
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {isRun
          ? <button className="btn btn-stop" onClick={()=>fetch(`${API}/api/pipeline/stop`,{method:'POST'})}>■ STOP</button>
          : <button className="btn btn-go" onClick={doRun} disabled={pipe?.agent_status!=='online'}>▶ RUN NIGHTLY</button>
        }
        <button className="btn" onClick={doReset}>↻ Reset</button>
      </div>
      {pipe?.agent_status !== 'online' && (
        <div className="card" style={{borderColor:'rgba(251,191,36,0.15)',background:'rgba(251,191,36,0.03)',marginBottom:12}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--amber)',marginBottom:6}}>Agent is offline. Start it locally:</div>
          <div onClick={e=>{navigator.clipboard.writeText('python local_runner/agent.py');e.target.style.color='var(--green)';setTimeout(()=>e.target.style.color='var(--cyan)',1000);}}
            style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--cyan)',background:'var(--bg)',
            padding:'8px 12px',borderRadius:4,border:'1px solid var(--border)',cursor:'pointer',userSelect:'all'}}>
            python local_runner/agent.py
            <span style={{float:'right',fontSize:9,color:'var(--text-muted)'}}>click to copy</span>
          </div>
        </div>
      )}
      {nightly?.state?.result_summary && (
        <div className="card" style={{borderColor:'rgba(52,211,153,0.15)',background:'rgba(52,211,153,0.03)'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--green)',whiteSpace:'pre-wrap'}}>{nightly.state.result_summary}</div>
        </div>
      )}
      {logs.length > 0 && (
        <div className="log-box" ref={logRef}>
          {logs.map((l,i) => <div key={i} className={l.toLowerCase().includes('error')?'err':l.includes('✓')?'ok':''}>{l}</div>)}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// PIPELINE STEP PAGE (reusable for steps 2-4, 6-7)
// ═══════════════════════════════════════════════════════
function StepPage({ stepId, setup }) {
  const [pipe, setPipe] = useState(null);
  const [logs, setLogs] = useState([]);
  const logRef = useRef(null);
  const logCountRef = useRef(0);

  const [grinderParams, setGrinderParams] = useState({beam: 10000, depth: 100, peak_target: 3});

  useEffect(() => {
    const load = () => fetch(`${API}/api/pipeline/steps`).then(r=>r.json()).then(setPipe).catch(()=>{});
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);

  const step = pipe?.steps?.find(s => s.id === stepId);
  const st = step?.state?.status || 'pending';
  const isRun = ['running','claimed','queued'].includes(st);

  useEffect(() => {
    if (!isRun) { logCountRef.current = 0; return; }
    const poll = () => fetch(`${API}/api/pipeline/logs/${stepId}?after=${logCountRef.current}`).then(r=>r.json())
      .then(d => { if(d.lines?.length) { logCountRef.current += d.lines.length; setLogs(p=>[...p,...d.lines]); } }).catch(()=>{});
    poll(); const id = setInterval(poll, 2000); return () => clearInterval(id);
  }, [isRun]);

  useEffect(() => { if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [logs]);

  function doRun() {
    const opts = {method:'POST', headers:{'Content-Type':'application/json'}};
    if (stepId === 'signal_brute') opts.body = JSON.stringify({params: grinderParams});
    fetch(`${API}/api/pipeline/run/${stepId}`, opts).then(r=>r.json()).then(d => {
      if(d.error) alert(d.error); else { setLogs([]); logCountRef.current = 0; }
    });
  }

  return (
    <div>
      <div className="stat-row" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">Status</div>
          <div className={`stat-val ${st==='done'?'green':isRun?'amber':''}`}>{st.toUpperCase()}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Duration</div>
          <div className="stat-val" style={{fontSize:13}}>{step?.state?.duration_s ? fmtDur(step.state.duration_s) : '—'}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Agent</div>
          <div className={`stat-val ${pipe?.agent_status==='online'?'green':'amber'}`} style={{fontSize:13}}>
            {pipe?.agent_status?.toUpperCase() || '?'}
          </div>
          <div onClick={e=>{navigator.clipboard.writeText('python local_runner/agent.py');e.target.style.color='var(--green)';setTimeout(()=>e.target.style.color='var(--cyan)',1000);}}
            style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',marginTop:4,cursor:'pointer',userSelect:'all'}}>
            python local_runner/agent.py <span style={{fontSize:8,color:'var(--text-muted)',marginLeft:4}}>copy</span>
          </div>
        </div>
      </div>
      {stepId === 'signal_brute' && !isRun && (
        <div style={{display:'flex',gap:12,marginBottom:12,alignItems:'center'}}>
          {[['beam','Beam'],['depth','Depth'],['peak_target','Peak']].map(([k,label])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:6}}>
              <label style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-dim)'}}>{label}</label>
              <input type="number" value={grinderParams[k]}
                onChange={e=>setGrinderParams(p=>({...p,[k]:parseInt(e.target.value)||0}))}
                style={{width:80,fontFamily:'var(--mono)',fontSize:12,color:'var(--text)',
                  background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:4,
                  padding:'4px 8px',outline:'none'}} />
            </div>
          ))}
        </div>
      )}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {isRun
          ? <button className="btn btn-stop" onClick={()=>fetch(`${API}/api/pipeline/stop`,{method:'POST'})}>■ STOP</button>
          : <button className="btn btn-go" onClick={doRun} disabled={pipe?.agent_status!=='online'}>▶ RUN</button>
        }
        <button className="btn" onClick={()=>fetch(`${API}/api/pipeline/reset/${stepId}`,{method:'POST'})}>↻ Reset</button>
      </div>
      {pipe?.agent_status !== 'online' && (

// ═══════════════════════════════════════════════════════
// EXIT GRINDER PAGE (Step 4a)
// ═══════════════════════════════════════════════════════
function ExitGrinderPage({ setup }) {
  const [pipe, setPipe]     = useState(null);
  const [results, setResults] = useState(null);
  const [choosing, setChoosing] = useState(null); // 'single'|'multi'|null
  const [logs, setLogs]     = useState([]);
  const logRef  = useRef(null);
  const logCountRef = useRef(0);

  const stepId = 'setup_grinder_a';

  // Poll pipeline state
  useEffect(() => {
    const load = () => fetch(`${API}/api/pipeline/steps`).then(r=>r.json()).then(setPipe).catch(()=>{});
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);

  // Poll exit grind results
  useEffect(() => {
    const load = () => fetch(`${API}/api/exit-grind/${setup}/results`)
      .then(r=>r.ok ? r.json() : null).then(d=>{ if(d) setResults(d); }).catch(()=>{});
    load(); const id = setInterval(load, 8000); return () => clearInterval(id);
  }, [setup]);

  const step = pipe?.steps?.find(s => s.id === stepId);
  const st   = step?.state?.status || 'pending';
  const isRun = ['running','claimed','queued'].includes(st);

  // Log streaming
  useEffect(() => {
    if (!isRun) { logCountRef.current = 0; return; }
    const poll = () => fetch(`${API}/api/pipeline/logs/${stepId}?after=${logCountRef.current}`)
      .then(r=>r.json())
      .then(d => { if(d.lines?.length) { logCountRef.current += d.lines.length; setLogs(p=>[...p,...d.lines]); } })
      .catch(()=>{});
    poll(); const id = setInterval(poll, 2000); return () => clearInterval(id);
  }, [isRun]);

  useEffect(() => { if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [logs]);

  function doRun() {
    fetch(`${API}/api/pipeline/run/${stepId}`, {method:'POST'})
      .then(r=>r.json()).then(d => { if(d.error) alert(d.error); else { setLogs([]); logCountRef.current = 0; } });
  }

  function doChoose(choice) {
    setChoosing(choice);
    fetch(`${API}/api/exit-grind/${setup}/choose`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({choice})
    }).then(r=>r.json()).then(d => {
      if(d.error) { alert(d.error); setChoosing(null); }
      else setResults(r => r ? {...r, choice} : r);
    }).catch(()=>setChoosing(null));
  }

  const pct = v => v != null ? `${(v*100).toFixed(1)}%` : '—';
  const adr = v => v != null ? `${v.toFixed(2)} ADR` : '—';
  const bars = v => v != null ? `${v.toFixed(1)} bars` : '—';

  const choiceMade = results?.choice;
  const s = results?.single;
  const m = results?.multi;

  return (
    <div>
      {/* Status row */}
      <div className="stat-row" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">Status</div>
          <div className={`stat-val ${st==='done'?'green':isRun?'amber':''}`}>{st.toUpperCase()}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Duration</div>
          <div className="stat-val" style={{fontSize:13}}>{step?.state?.duration_s ? fmtDur(step.state.duration_s) : '—'}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Agent</div>
          <div className={`stat-val ${pipe?.agent_status==='online'?'green':'amber'}`} style={{fontSize:13}}>
            {pipe?.agent_status?.toUpperCase() || '?'}
          </div>
          <div onClick={e=>{navigator.clipboard.writeText('python local_runner/agent.py');e.target.style.color='var(--green)';setTimeout(()=>e.target.style.color='var(--cyan)',1000);}}
            style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',marginTop:4,cursor:'pointer',userSelect:'all'}}>
            python local_runner/agent.py <span style={{fontSize:8,color:'var(--text-muted)',marginLeft:4}}>copy</span>
          </div>
        </div>
        {choiceMade && (
          <div className="stat-box">
            <div className="stat-label">Exit Choice</div>
            <div className="stat-val green">{choiceMade.toUpperCase()}-STAGE</div>
          </div>
        )}
      </div>

      {/* Run/Stop */}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {isRun
          ? <button className="btn btn-stop" onClick={()=>fetch(`${API}/api/pipeline/stop`,{method:'POST'})}>■ STOP</button>
          : <button className="btn btn-go" onClick={doRun} disabled={pipe?.agent_status!=='online'}>▶ RUN</button>
        }
        <button className="btn" onClick={()=>fetch(`${API}/api/pipeline/reset/${stepId}`,{method:'POST'})}>↻ Reset</button>
      </div>

      {pipe?.agent_status !== 'online' && (
        <div className="card" style={{borderColor:'rgba(251,191,36,0.15)',background:'rgba(251,191,36,0.03)',marginBottom:12}}>
          <div onClick={e=>{navigator.clipboard.writeText('python local_runner/agent.py');e.target.style.color='var(--green)';setTimeout(()=>e.target.style.color='var(--cyan)',1000);}}
            style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--cyan)',background:'var(--bg)',
            padding:'6px 10px',borderRadius:4,border:'1px solid var(--border)',cursor:'pointer'}}>
            python local_runner/agent.py <span style={{fontSize:9,color:'var(--text-muted)',marginLeft:8}}>click to copy</span>
          </div>
        </div>
      )}

      {/* Results panel — single vs multi side by side */}
      {(s || m) && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
          {/* Single-stage */}
          <div className="card" style={{
            borderColor: choiceMade==='single' ? 'var(--green)' : 'var(--border)',
            background: choiceMade==='single' ? 'rgba(52,211,153,0.05)' : undefined,
            position:'relative'
          }}>
            <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-muted)',marginBottom:8,letterSpacing:'0.05em'}}>
              SINGLE-STAGE EXIT
            </div>
            {s ? (
              <>
                <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--cyan)',marginBottom:10,wordBreak:'break-all'}}>
                  {s.expression} {s.direction} {s.threshold?.toFixed(6)}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:12}}>
                  {[
                    ['Floor Capture', pct(s.floor_capture_eff)],
                    ['Median Capture', pct(s.median_capture_eff)],
                    ['Floor ADR', adr(s.floor_adr)],
                    ['Median ADR', adr(s.median_adr)],
                    ['Avg Bars', bars(s.avg_bars_to_exit)],
                    ['Examples', s.n_examples ?? '—'],
                  ].map(([label,val])=>(
                    <div key={label}>
                      <div style={{fontSize:9,color:'var(--text-muted)',fontFamily:'var(--mono)',marginBottom:2}}>{label}</div>
                      <div style={{fontSize:12,color:'var(--text)',fontFamily:'var(--mono)'}}>{val}</div>
                    </div>
                  ))}
                </div>
                <button
                  className="btn btn-go"
                  style={{width:'100%',opacity: choiceMade==='single'?0.5:1}}
                  disabled={!!choiceMade || choosing==='single'}
                  onClick={()=>doChoose('single')}
                >
                  {choiceMade==='single' ? '✓ SELECTED' : choosing==='single' ? 'Saving…' : 'Use Single-Stage'}
                </button>
              </>
            ) : (
              <div style={{color:'var(--text-muted)',fontSize:11,fontFamily:'var(--mono)'}}>Not yet run</div>
            )}
          </div>

          {/* Multi-stage */}
          <div className="card" style={{
            borderColor: choiceMade==='multi' ? 'var(--green)' : 'var(--border)',
            background: choiceMade==='multi' ? 'rgba(52,211,153,0.05)' : undefined,
          }}>
            <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-muted)',marginBottom:8,letterSpacing:'0.05em'}}>
              MULTI-STAGE EXIT
            </div>
            {m ? (
              <>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
                  {[
                    ['Stages', m.n_stages ?? '—'],
                    ['Floor Capture', pct(m.floor_capture_eff)],
                    ['Median Capture', pct(m.median_capture_eff)],
                    ['Avg Bars (full)', bars(m.avg_bars_to_full_exit)],
                    ['Examples', m.n_examples ?? '—'],
                  ].map(([label,val])=>(
                    <div key={label}>
                      <div style={{fontSize:9,color:'var(--text-muted)',fontFamily:'var(--mono)',marginBottom:2}}>{label}</div>
                      <div style={{fontSize:12,color:'var(--text)',fontFamily:'var(--mono)'}}>{val}</div>
                    </div>

                </div>
                {/* Stage breakdown */}
                {m.stages?.length > 0 && (
                  <div style={{marginBottom:12}}>
                    {m.stages.map((stg, i) => (
                      <div key={i} style={{
                        fontFamily:'var(--mono)',fontSize:10,color:'var(--text-dim)',
                        padding:'4px 6px',background:'var(--surface-2)',borderRadius:3,marginBottom:4,
                        borderLeft:`2px solid var(--cyan)`

                        <span style={{color:'var(--cyan)'}}>S{i+1}</span>{' '}
                        {stg.trim_pct != null ? `trim ${(stg.trim_pct*100).toFixed(0)}%` : ''}{' '}
                        {stg.gate_type && stg.gate_value != null ? `· gate ${stg.gate_type} ${stg.gate_value}` : ''}{' '}
                        · {stg.expr_name} {stg.direction} {stg.threshold?.toFixed(4)}
                        {stg.max_window ? ` · max ${stg.max_window}b` : ''}
                      </div>
                    ))}
                  </div>
                )}
                <button
                  className="btn btn-go"
                  style={{width:'100%',opacity: choiceMade==='multi'?0.5:1}}
                  disabled={!!choiceMade || choosing==='multi'}
                  onClick={()=>doChoose('multi')}
                >
                  {choiceMade==='multi' ? '✓ SELECTED' : choosing==='multi' ? 'Saving…' : 'Use Multi-Stage'}
                </button>
              </>
            ) : (
              <div style={{color:'var(--text-muted)',fontSize:11,fontFamily:'var(--mono)'}}>Not yet run</div>
            )}
          </div>
        </div>
      )}

      {/* Change choice link */}
      {choiceMade && (
        <div style={{marginBottom:12,fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)'}}>
          Choice locked. To change:{' '}
          <span style={{color:'var(--cyan)',cursor:'pointer'}}
            onClick={()=>{
              if(!confirm('Clear exit choice? This will reset 4b.')) return;
              fetch(`${API}/api/exit-grind/${setup}/clear-choice`,{method:'POST'})
                .then(()=>{
                  fetch(`${API}/api/pipeline/reset/setup_grinder_b`,{method:'POST'});
                  setResults(r=>r?{...r,choice:null}:r);
                });
            }}>change choice</span>
        </div>
      )}

      {/* Error */}
      {step?.state?.error && (
        <div className="card" style={{borderColor:'rgba(248,113,113,0.15)',background:'rgba(248,113,113,0.03)',marginBottom:12}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',whiteSpace:'pre-wrap'}}>{step.state.error}</div>
        </div>
      )}

      {/* Logs */}
      {logs.length > 0 && (
        <div className="log-box" ref={logRef}>
          {logs.map((l,i) => <div key={i} className={l.toLowerCase().includes('error')?'err':l.includes('✓')||l.includes('done')?'ok':''}>{l}</div>)}
        </div>
      )}
      {logs.length === 0 && st === 'pending' && !s && !m && (
        <div className="empty-state"><div className="icon">⚡</div>Ready to run</div>
      )}
    </div>
  );
}

// MINI CHART (for examples gallery)
// ═══════════════════════════════════════════════════════
function MiniChart({ data, entryDate }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current; if (!canvas || !data.length) return;
    const W = canvas.width = canvas.parentElement.clientWidth - 24;
    const H = canvas.height = 80;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, W, H);
    const prices = data.flatMap(c => [c.high, c.low]);
    const mn = Math.min(...prices)*0.998, mx = Math.max(...prices)*1.002;
    const cw = W / data.length, bw = Math.max(1, cw * 0.6);
    const py = p => H * (1 - (p - mn) / (mx - mn));
    data.forEach((c, i) => {
      const x = i * cw + cw / 2, up = c.close >= c.open;
      const color = c.date === entryDate ? '#3b82f6' : up ? '#26A69A' : '#EF5350';
      ctx.strokeStyle = color; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(x, py(c.high)); ctx.lineTo(x, py(c.low)); ctx.stroke();
      const t = py(Math.max(c.open, c.close)), b = py(Math.min(c.open, c.close));
      if (up) { ctx.strokeStyle = color; ctx.strokeRect(x-bw/2, t, bw, Math.max(1,b-t)); }
      else { ctx.fillStyle = color; ctx.fillRect(x-bw/2, t, bw, Math.max(1,b-t)); }
    });
  }, [data, entryDate]);
  return <canvas ref={ref} style={{display:'block', marginTop:6, borderRadius:3}} />;
}

// EXAMPLES PAGE
// ═══════════════════════════════════════════════════════
function ExamplesPage({ setup }) {
  const [examples, setExamples] = useState([]);
  const [rejected, setRejected] = useState([]);
  const [pending, setPending] = useState([]);
  const [tab, setTab] = useState('examples');
  const [showCharts, setShowCharts] = useState(false);
  const [chartData, setChartData] = useState({});

  const reload = () => {
    fetch(`${API}/api/examples/${setup}`).then(r=>r.json()).then(d => setExamples(d.examples || [])).catch(()=>{});
    fetch(`${API}/api/vetting/${setup}/rejected`).then(r=>r.json()).then(d => setRejected(d.rejected || [])).catch(()=>{});
    fetch(`${API}/api/pending/${setup}`).then(r=>r.json()).then(d => setPending(d.pending || [])).catch(()=>{});
  };

  useEffect(reload, [setup]);

  function loadChart(ticker, entryDate) {
    const key = `${ticker}_${entryDate}`;
    if (chartData[key]) return;
    fetch(`${API}/api/vetting/${setup}/ohlcv/${ticker}?signal_date=${entryDate}&lookback=60&forward=30`)
      .then(r=>r.json()).then(d => setChartData(prev => ({...prev, [key]: d.data || []}))).catch(()=>{});
  }

  useEffect(() => {
    if (showCharts && tab==='examples') {
      examples.forEach(ex => loadChart(ex.ticker, ex.entryDate));
    }

  return (
    <div>
      <div className="stat-row" style={{marginBottom:16}}>

          <div className="stat-label">Optimal Samples</div>
          <div className="stat-val green">{examples.length}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Rejected</div>
          <div className="stat-val" style={{color:'var(--red)'}}>{rejected.length}</div>
        </div>

          {rejected.length === 0 && <div className="empty-state"><div className="icon">∅</div>No rejected signals yet</div>}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// VETTING PAGE (ported from vetting.html)
// ═══════════════════════════════════════════════════════
function VettingChart({ candles, ticker, signalDate, selectedDate, onSelectDate, exitDate, earningsDates }) {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  const volCanvasRef = useRef(null);
  const [dims, setDims] = useState({ w: 900, h: 520 });
  const [hoverIdx, setHoverIdx] = useState(null);
  const [scrollOffset, setScrollOffset] = useState(0);
  const VISIBLE = Math.max(candles.length, 330);

  const UP='#26A69A',DOWN='#EF5350',BG='#08090b',GRID='rgba(35,37,41,0.6)';
  const EMA8='#5dade2',EMA21='#d4a853',SMA50='#f5c542',SMA200='#e74c3c';
  const SIGNAL_COLOR='#f59e0b',SELECTED_COLOR='#3b82f6',EXIT_COLOR='#a855f7';

  useEffect(() => {
    function resize() {
      if(containerRef.current) { const w=containerRef.current.clientWidth; setDims({w, h:Math.max(400,containerRef.current.clientHeight)}); }
    }
    resize(); window.addEventListener('resize',resize); return ()=>window.removeEventListener('resize',resize);
  }, []);

  const closes=candles.map(c=>c.close), ema8=ema(closes,8), ema21=ema(closes,21), sma50v=sma(closes,50), sma200v=sma(closes,200);
  const vols=candles.map(c=>c.volume||0), volAvg=sma(vols,20);
  const enriched=candles.map((c,i)=>({...c,ema8:ema8[i],ema21:ema21[i],sma50:sma50v[i],sma200:sma200v[i],volAvg20:volAvg[i]}));

  const maxOffset=Math.max(0,enriched.length-VISIBLE);
  const offset=Math.min(Math.max(0,scrollOffset),maxOffset);
  const visible=enriched.slice(offset,offset+VISIBLE);

  useEffect(() => {
    const sigIdx=enriched.findIndex(c=>c.date===signalDate);
    if(sigIdx>=0) setScrollOffset(Math.max(0,sigIdx-Math.floor(VISIBLE*0.5)));
    else setScrollOffset(maxOffset);
  }, [candles, signalDate]);

  const MARGIN={top:32,right:64,bottom:0}, VOL_H=70;
  const CHART_H=dims.h-MARGIN.top-VOL_H, CHART_W=dims.w-MARGIN.right;
  const candleW=CHART_W/VISIBLE, bodyW=Math.max(1,candleW*0.6);
  const prices=visible.flatMap(c=>[c.high,c.low]);
  const pMin=Math.min(...prices)*0.995, pMax=Math.max(...prices)*1.005;
  const priceY=p=>MARGIN.top+CHART_H*(1-(p-pMin)/(pMax-pMin));
  const candleX=i=>i*candleW+candleW/2;
  const volMax=Math.max(...visible.map(c=>c.volume||0))||1;

  // Draw price chart
  useEffect(() => {
    const canvas=canvasRef.current; if(!canvas||!visible.length) return;
    canvas.width=dims.w; canvas.height=dims.h-VOL_H;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle=BG; ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle=GRID; ctx.lineWidth=0.5;
    for(let i=0;i<=6;i++){const y=MARGIN.top+(CHART_H/6)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CHART_W,y);ctx.stroke();
      const price=pMax-((pMax-pMin)/6)*i;ctx.fillStyle='#62656d';ctx.font='10px JetBrains Mono';ctx.textAlign='left';ctx.fillText(price.toFixed(2),CHART_W+6,y+3);}

    function drawMA(key,color){ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.beginPath();let s=false;
      visible.forEach((c,i)=>{if(c[key]==null)return;const x=candleX(i),y=priceY(c[key]);if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);});ctx.stroke();}
    drawMA('ema8',EMA8);drawMA('ema21',EMA21);drawMA('sma50',SMA50);drawMA('sma200',SMA200);

    visible.forEach((c,i) => {
      const x=candleX(i), isUp=c.close>=c.open, color=isUp?UP:DOWN;
      const isSig=c.date===signalDate, isSel=c.date===selectedDate, isExit=c.date===exitDate;

      if(isSig){ctx.fillStyle='rgba(245,158,11,0.1)';ctx.fillRect(x-candleW/2,MARGIN.top,candleW,CHART_H);
        ctx.strokeStyle=SIGNAL_COLOR;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,MARGIN.top);ctx.lineTo(x,MARGIN.top+CHART_H);ctx.stroke();ctx.setLineDash([]);}
      if(isSel&&!isSig){ctx.fillStyle='rgba(59,130,246,0.12)';ctx.fillRect(x-candleW/2,MARGIN.top,candleW,CHART_H);
        ctx.strokeStyle=SELECTED_COLOR;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,MARGIN.top);ctx.lineTo(x,MARGIN.top+CHART_H);ctx.stroke();ctx.setLineDash([]);}
      if(isExit){ctx.strokeStyle=EXIT_COLOR;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,MARGIN.top);ctx.lineTo(x,MARGIN.top+CHART_H);ctx.stroke();ctx.setLineDash([]);}

      ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,priceY(c.high));ctx.lineTo(x,priceY(c.low));ctx.stroke();
      const bTop=priceY(Math.max(c.open,c.close)),bBot=priceY(Math.min(c.open,c.close)),bH=Math.max(1,bBot-bTop);
      if(isUp){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.strokeRect(x-bodyW/2,bTop,bodyW,bH);}
      else{ctx.fillStyle=color;ctx.fillRect(x-bodyW/2,bTop,bodyW,bH);}

      if(isSig){ctx.fillStyle=SIGNAL_COLOR;ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.fillText('SIGNAL',x,MARGIN.top+CHART_H-4);}
      if(isSel&&!isSig){ctx.fillStyle=SELECTED_COLOR;ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.fillText('ENTRY',x,priceY(c.low)+20);}
      if(isExit){ctx.fillStyle=EXIT_COLOR;ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.fillText('EXIT',x,MARGIN.top+14);}
    });

    // Earnings markers
    if(earningsDates&&earningsDates.length>0){const edSet=new Set(earningsDates);
      visible.forEach((c,i)=>{const prevDate=i>0?visible[i-1].date:(offset>0?enriched[offset-1]?.date:null);
        const isReaction=prevDate&&edSet.has(prevDate),isReport=edSet.has(c.date);
        if(isReport||isReaction){const x=candleX(i);
          ctx.fillStyle=isReaction?'rgba(168,85,247,0.12)':'rgba(168,85,247,0.06)';ctx.fillRect(x-candleW/2,MARGIN.top,candleW,CHART_H);
          ctx.fillStyle='#a855f7';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.fillText('E',x,MARGIN.top+10);}});}

    ctx.fillStyle='rgba(255,255,255,0.04)';ctx.font='bold 48px DM Sans';ctx.textAlign='right';ctx.fillText(ticker,CHART_W-12,MARGIN.top+52);

    if(hoverIdx!=null&&visible[hoverIdx]){const c=visible[hoverIdx],x=candleX(hoverIdx);
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=0.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,MARGIN.top);ctx.lineTo(x,MARGIN.top+CHART_H);ctx.stroke();ctx.setLineDash([]);
      const isUp=c.close>=c.open;ctx.fillStyle=isUp?UP:DOWN;ctx.font='11px JetBrains Mono';ctx.textAlign='left';
      ctx.fillText(`${c.date}  O:${c.open?.toFixed(2)} H:${c.high?.toFixed(2)} L:${c.low?.toFixed(2)} C:${c.close?.toFixed(2)}  V:${(c.volume/1e6)?.toFixed(1)}M`,8,16);}
  }, [visible,dims,hoverIdx,selectedDate,signalDate,exitDate,earningsDates]);

  // Volume
  useEffect(() => {
    const canvas=volCanvasRef.current; if(!canvas||!visible.length) return;
    canvas.width=dims.w; canvas.height=VOL_H;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle=BG;ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle=GRID;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(CHART_W,0);ctx.stroke();
    visible.forEach((c,i)=>{const x=candleX(i),isUp=c.close>=c.open,barH=((c.volume||0)/volMax)*(VOL_H-8);
      ctx.fillStyle=isUp?'rgba(38,166,154,0.35)':'rgba(239,83,80,0.35)';ctx.fillRect(x-bodyW/2,VOL_H-barH,bodyW,barH);});
    ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.lineWidth=1;ctx.beginPath();let s=false;
    visible.forEach((c,i)=>{if(c.volAvg20==null)return;const x=candleX(i),y=VOL_H-(c.volAvg20/volMax)*(VOL_H-8);if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);});ctx.stroke();
    ctx.fillStyle='#62656d';ctx.font='9px JetBrains Mono';ctx.textAlign='center';
    const step=Math.max(1,Math.floor(VISIBLE/10));
    visible.forEach((c,i)=>{if(i%step===0){const p=c.date.split('-');ctx.fillText(p[1]+'/'+p[2],candleX(i),VOL_H-2);}});
  }, [visible,dims]);

  function getIdx(e,canvas){const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left;const idx=Math.floor(mx/candleW);return idx>=0&&idx<visible.length?idx:null;}

  return (
    <div ref={containerRef} style={{width:'100%',height:'100%'}}>
      <canvas ref={canvasRef} style={{display:'block',cursor:'crosshair'}}
        onMouseMove={e=>setHoverIdx(getIdx(e,canvasRef.current))}
        onMouseLeave={()=>setHoverIdx(null)}
        onClick={e=>{const idx=getIdx(e,canvasRef.current);if(idx!=null&&visible[idx])onSelectDate(visible[idx].date);}}
        onWheel={e=>{e.preventDefault();setScrollOffset(p=>Math.min(Math.max(0,p+(e.deltaY>0?5:-5)),maxOffset));}}
      />
      <canvas ref={volCanvasRef} style={{display:'block'}} />
    </div>
  );
}

function VettingPage({ setup }) {
  const [signals, setSignals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [candles, setCandles] = useState([]);
  const [chartLoading, setChartLoading] = useState(false);
  const [selectedEntry, setSelectedEntry] = useState(null);
  const [filter, setFilter] = useState('all');
  const [saving, setSaving] = useState(false);
  const [earningsDates, setEarningsDates] = useState([]);
  const [pipe, setPipe] = useState(null);
  const [filterLogs, setFilterLogs] = useState([]);
  const [showLogs, setShowLogs] = useState(false);
  const filterLogRef = useRef(null);
  const [source, setSource] = useState('step2'); // 'step2' | 'step4'

  // Poll pipeline state for agent status + step state
  useEffect(() => {
    const load = () => fetch(`${API}/api/pipeline/steps`).then(r=>r.json()).then(setPipe).catch(()=>{});
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);

  const stepState = pipe?.steps?.find(s=>s.id==='sample_expansion')?.state;
  const stepStatus = stepState?.status || 'pending';
  const isFilterRunning = ['running','claimed','queued'].includes(stepStatus);

  // Poll logs while filter is running
  const filterLogCountRef = useRef(0);
  useEffect(() => {
    if (!isFilterRunning) { filterLogCountRef.current = 0; return; }
    setShowLogs(true);
    const poll = () => fetch(`${API}/api/pipeline/logs/sample_expansion?after=${filterLogCountRef.current}`).then(r=>r.json())
      .then(d => { if(d.lines?.length) { filterLogCountRef.current += d.lines.length; setFilterLogs(p=>[...p,...d.lines]); } }).catch(()=>{});
    poll(); const id = setInterval(poll, 2000); return () => clearInterval(id);
  }, [isFilterRunning]);

  // Auto-scroll logs
  useEffect(() => { if(filterLogRef.current) filterLogRef.current.scrollTop = filterLogRef.current.scrollHeight; }, [filterLogs]);

  // Refresh signals when filter finishes
  const prevRunning = useRef(false);
  useEffect(() => {
    if (prevRunning.current && !isFilterRunning) {
      // Just finished — reload signals
      setLoading(true);
      fetch(`${API}/api/vetting/${setup}/signals`).then(r=>r.json())
        .then(d=>{setSignals(d.signals||[]);setLoading(false);setCurrentIdx(0);}).catch(()=>setLoading(false));
    }
    prevRunning.current = isFilterRunning;
  }, [isFilterRunning]);

  function reloadSamples() {
    setFilterLogs([]);
    fetch(`${API}/api/pipeline/run/sample_expansion`, {method:'POST'}).then(r=>r.json()).then(d => {
      if(d.error) {
        if(d.error.includes('Prerequisite')) {
          alert('Signal Brute Forcing (Step 2) must run first.\n\nAfter adding new examples through vetting, the full chain needs to re-run:\n  Step 2: Grind → finds conditions that pass ALL examples\n  Step 3: Filter → scans with those conditions\n\nGo to Step 2 and run the grind first.');
        } else {
          alert(d.error);
        }
      }
    });
  }

  function signalFetchUrl() {
    return source === 'step4'
      ? `${API}/api/setup-grinder/${setup}/signals`
      : `${API}/api/vetting/${setup}/signals`;
  }

  useEffect(() => {
    setLoading(true);
    setSignals([]);
    setCurrentIdx(0);
    fetch(signalFetchUrl()).then(r=>r.json())
      .then(d=>{setSignals(d.signals||[]);setLoading(false);}).catch(()=>setLoading(false));
  }, [setup, source]);

  const filtered = signals.filter(s => {
    if(filter==='all') return true; if(filter==='unvetted') return !s.verdict; return s.verdict===filter;
  });
  const current = filtered[currentIdx] || null;

  // Prefetch cache: load current + next 3 charts
  const ohlcvCache = useRef({});

  function fetchOhlcv(ticker, date) {
    const key = `${ticker}_${date}`;
    if (ohlcvCache.current[key]) return Promise.resolve(ohlcvCache.current[key]);
    return fetch(`${API}/api/vetting/${setup}/ohlcv/${ticker}?signal_date=${date}&lookback=250&forward=80`)
      .then(r=>r.json()).then(d => { ohlcvCache.current[key] = d.data || []; return ohlcvCache.current[key]; });
  }

  useEffect(() => {
    if(!current){setCandles([]);setEarningsDates([]);return;}
    setChartLoading(true); setSelectedEntry(current.entry_date||null);
    fetchOhlcv(current.ticker, current.date)
      .then(data=>{setCandles(data);setChartLoading(false);}).catch(()=>setChartLoading(false));
    setEarningsDates([]);
    fetch(`${API}/api/vetting/earnings/${current.ticker}`).then(r=>r.json()).then(d=>setEarningsDates(d.earnings_dates||[])).catch(()=>{});
    // Prefetch next 3
    for(let i=1;i<=3;i++){
      const next=filtered[currentIdx+i];
      if(next) fetchOhlcv(next.ticker, next.date).catch(()=>{});
    }
  }, [current?.ticker, current?.date]);

  function saveVerdict(verdict) {
    if(!current) return;
    if(verdict==='yes'&&!selectedEntry){alert('Click a candle to set entry date first');return;}
    setSaving(true);
    fetch(`${API}/api/vetting/${setup}/decide`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ticker:current.ticker,signal_date:current.date,verdict,entry_date:verdict==='yes'?selectedEntry:null})})
      .then(r=>r.json()).then(()=>{
        const key=`${current.ticker}_${current.date}`;
        setSignals(p=>p.map(s=>`${s.ticker}_${s.date}`===key?{...s,verdict,entry_date:verdict==='yes'?selectedEntry:null}:s));
        setSaving(false);
        const nextIdx=filtered.findIndex((s,i)=>i>currentIdx&&!s.verdict);
        if(nextIdx>=0)setCurrentIdx(nextIdx);else if(currentIdx<filtered.length-1)setCurrentIdx(currentIdx+1);
      }).catch(()=>setSaving(false));
  }

  useEffect(() => {
    function handler(e){
      if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();setCurrentIdx(i=>Math.min(i+1,filtered.length-1));}
      if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();setCurrentIdx(i=>Math.max(i-1,0));}
      if(e.key==='1'||e.key==='y') saveVerdict('yes');
      if(e.key==='2'||e.key==='m') { if(source!=='step4') saveVerdict('maybe'); }
      if(e.key==='3'||e.key==='n') saveVerdict('no');
    }
    window.addEventListener('keydown',handler); return ()=>window.removeEventListener('keydown',handler);
  }, [current,selectedEntry,currentIdx,filtered.length]);

  const counts={yes:0,maybe:0,no:0,unvetted:0};
  signals.forEach(s=>{if(s.verdict)counts[s.verdict]++;else counts.unvetted++;});

  if(loading) return <div className="empty-state"><div className="icon">⏳</div>Loading signals...</div>;
  if(signals.length===0) return (
    <div>
      <div className="stat-row" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">Filter Status</div>
          <div className={`stat-val ${stepStatus==='done'?'green':isFilterRunning?'amber':''}`}>{stepStatus.toUpperCase()}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Agent</div>
          <div className={`stat-val ${pipe?.agent_status==='online'?'green':'amber'}`} style={{fontSize:13}}>
            {pipe?.agent_status?.toUpperCase() || '?'}
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {isFilterRunning
          ? <button className="btn btn-stop" onClick={()=>fetch(`${API}/api/pipeline/stop`,{method:'POST'})}>■ STOP</button>
          : <button className="btn btn-go" onClick={reloadSamples} disabled={pipe?.agent_status!=='online'}>▶ RELOAD SAMPLES</button>
        }
      </div>
      {pipe?.agent_status !== 'online' && !isFilterRunning && (
        <div className="card" style={{borderColor:'rgba(251,191,36,0.15)',background:'rgba(251,191,36,0.03)',marginBottom:12}}>
          <div style={{fontSize:11,color:'var(--amber)',marginBottom:6}}>Agent offline — start it to run signal filter:</div>
          <div onClick={e=>{navigator.clipboard.writeText('python local_runner/agent.py');e.target.style.color='var(--green)';setTimeout(()=>e.target.style.color='var(--cyan)',1000);}}
            style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--cyan)',background:'var(--bg)',
            padding:'6px 10px',borderRadius:4,border:'1px solid var(--border)',cursor:'pointer'}}>
            python local_runner/agent.py <span style={{fontSize:9,color:'var(--text-muted)',marginLeft:8}}>click to copy</span>
          </div>
        </div>
      )}
      {showLogs && filterLogs.length > 0 && (
        <div className="log-box" ref={filterLogRef}>
          {filterLogs.map((l,i) => <div key={i} className={l.toLowerCase().includes('error')?'err':l.includes('✓')||l.includes('done')?'ok':''}>{l}</div>)}
        </div>
      )}
      {!showLogs && !isFilterRunning && (
        <div className="empty-state"><div className="icon">∅</div>No filtered signals. Click RELOAD SAMPLES to run signal filter.</div>
      )}
    </div>
  );

  return (
    <div className="vet-layout">
      <div className="vet-list">
        <div style={{display:'flex',gap:0,padding:'8px 10px 0',borderBottom:'1px solid var(--border)'}}>
          {[['step2','Step 2'],['step4','Step 4']].map(([s,label])=>(
            <button key={s} onClick={()=>{setSource(s);setFilter('all');}}
              style={{flex:1,padding:'5px 0',fontSize:10,fontFamily:'var(--mono)',fontWeight:700,cursor:'pointer',
                border:'1px solid var(--border)',borderRadius: s==='step2'?'4px 0 0 4px':'0 4px 4px 0',
                background:source===s?'var(--cyan)':'transparent',
                color:source===s?'var(--bg)':'var(--text-muted)',
                marginLeft:s==='step4'?-1:0}}>{label}</button>
          ))}
        </div>
        <div className="vet-filter-bar">
          {['all','unvetted','yes','maybe','no'].map(f=>{
            const disabled = source==='step4' && f==='maybe';
            return (
              <button key={f} className={`vet-filter-btn ${filter===f?'on':''}`}
                disabled={disabled}
                onClick={()=>{if(!disabled){setFilter(f);setCurrentIdx(0);}}}
                style={disabled?{opacity:0.3,cursor:'not-allowed'}:{}}
              >{f} {f==='all'?signals.length:f==='unvetted'?counts.unvetted:counts[f]}</button>
            );
          })}
        </div>
        {filtered.map((sig,i) => {
          const noExit = source==='step4' && !sig.exit_date;
          return (
          <div key={`${sig.ticker}_${sig.date}`}
            className={`vet-item ${i===currentIdx?'on':''} ${sig.verdict?'v-'+sig.verdict:''}`}
            style={noExit?{opacity:0.45}:{}}
            onClick={()=>setCurrentIdx(i)}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span className="vet-ticker">{sig.ticker}</span>
              <span style={{display:'flex',alignItems:'center',gap:4}}>
                {noExit && <span style={{fontSize:8,fontFamily:'var(--mono)',padding:'1px 4px',borderRadius:2,background:'rgba(251,191,36,0.15)',color:'var(--amber)',fontWeight:700,letterSpacing:'0.05em'}}>NO EXIT</span>}
                <span className="vet-adr" style={{fontFamily:'var(--mono)',fontSize:11}}>+{sig.move_adr?.toFixed(1)}</span>
              </span>
            </div>
            <div className="vet-meta">
              <span>{sig.date}</span>
              <span>{sig.exit_bar}d {sig.verdict && <span style={{textTransform:'uppercase',fontWeight:700,
                color:sig.verdict==='yes'?'var(--green)':sig.verdict==='maybe'?'var(--amber)':'var(--red)'}}>{sig.verdict}</span>}</span>
            </div>
          </div>
          );
        })}
      </div>
      <div className="vet-chart">
        {isFilterRunning || (showLogs && filterLogs.length > 0) ? (
          <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
            <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12}}>
              {isFilterRunning && <span className="pulse-dot" style={{width:8,height:8,borderRadius:'50%',background:'var(--green)',display:'inline-block'}} />}
              <span style={{fontFamily:'var(--mono)',fontSize:12,fontWeight:700,color:isFilterRunning?'var(--green)':'var(--text-dim)'}}>
                {isFilterRunning ? 'Signal Filter Running...' : 'Signal Filter Complete'}
              </span>
              {isFilterRunning && filterLogs.length > 0 && (
                <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)',marginLeft:'auto'}}>
                  {filterLogs.length} lines
                </span>
              )}
              {!isFilterRunning && filterLogs.length > 0 && (
                <button onClick={()=>{setShowLogs(false);setFilterLogs([]);}}
                  style={{marginLeft:'auto',padding:'2px 8px',borderRadius:3,fontSize:9,fontFamily:'var(--mono)',
                    border:'1px solid var(--border)',background:'transparent',color:'var(--text-muted)',cursor:'pointer'}}>
                  ✕ CLOSE
                </button>
              )}
            </div>
            <div className="log-box" ref={filterLogRef} style={{flex:1,maxHeight:'none',borderRadius:0,border:'none'}}>
              {filterLogs.map((l,i) => <div key={i} className={l.toLowerCase().includes('error')?'err':l.includes('✓')||l.toLowerCase().includes('done')?'ok':''}>{l}</div>)}
              {isFilterRunning && filterLogs.length === 0 && (
                <div style={{color:'var(--text-muted)'}}>Waiting for agent to start signal_filter.py...</div>
              )}
            </div>
          </div>
        ) : current ? (
          <>
            <div className="vet-chart-hdr">
              <div className="vet-chart-info">
                <span className="vet-chart-ticker">{current.ticker}</span>
                <span className="vet-chart-meta">
                  Signal: {current.date} · Exit: {current.exit_date} ({current.exit_bar}d)
                  · Move: +{current.move_adr?.toFixed(1)} ADR
                  · Eff: {current.capture_eff?(current.capture_eff*100).toFixed(0):'?'}%
                </span>
              </div>
              <div className="vet-btns">
                <button
                  onClick={isFilterRunning ? ()=>fetch(`${API}/api/pipeline/stop`,{method:'POST'}) : reloadSamples}
                  disabled={!isFilterRunning && pipe?.agent_status!=='online'}
                  style={{padding:'4px 10px',borderRadius:4,fontSize:10,fontFamily:'var(--mono)',fontWeight:700,cursor:'pointer',marginRight:12,
                    border:isFilterRunning?'1px solid var(--red)':'1px solid var(--cyan)',
                    color:isFilterRunning?'#fff':'var(--cyan)',
                    background:isFilterRunning?'var(--red)':'transparent',
                    opacity:(!isFilterRunning && pipe?.agent_status!=='online')?0.4:1}}
                  title={pipe?.agent_status!=='online'?'Agent offline — start agent first':'Re-run signal filter'}>
                  {isFilterRunning ? '■ STOP' : '↻ RELOAD'}
                </button>
                {selectedEntry && <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--blue)',marginRight:8}}>Entry: {selectedEntry}</span>}
                <button className={`vet-btn yes ${current.verdict==='yes'?'sel':''}`} onClick={()=>saveVerdict('yes')} disabled={saving}>YES (1)</button>
                <button className={`vet-btn maybe ${current.verdict==='maybe'?'sel':''}`} onClick={()=>saveVerdict('maybe')} disabled={saving||source==='step4'} style={source==='step4'?{opacity:0.3,cursor:'not-allowed'}:{}}>MAYBE (2)</button>
                <button className={`vet-btn no ${current.verdict==='no'?'sel':''}`} onClick={()=>saveVerdict('no')} disabled={saving}>NO (3)</button>
              </div>
            </div>
            <div className="vet-canvas-area">
              {chartLoading ? <div className="empty-state">Loading chart...</div> : (
                <VettingChart candles={candles} ticker={current.ticker} signalDate={current.date}
                  selectedDate={selectedEntry} onSelectDate={setSelectedEntry}
                  exitDate={current.exit_date} earningsDates={earningsDates} />
              )}
            </div>
          </>
        ) : (
          <div className="empty-state">{filtered.length===0?'No signals match filter':'Select a signal'}</div>
        )}
      </div>
      <div className="kbd-hint">
        <kbd>↑</kbd><kbd>↓</kbd> nav · <kbd>1</kbd> yes · <kbd>2</kbd> maybe · <kbd>3</kbd> no · click = entry
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// SETUP HOME PAGE
// ═══════════════════════════════════════════════════════
function SetupHomePage({ setup }) {
  const [examples, setExamples] = useState([]);
  const [pipe, setPipe] = useState(null);
  const [grindHistory, setGrindHistory] = useState([]);

  useEffect(() => {
    fetch(`${API}/api/examples/${setup}`).then(r=>r.json()).then(d=>setExamples(d.examples||[])).catch(()=>{});
    fetch(`${API}/api/pipeline/steps`).then(r=>r.json()).then(setPipe).catch(()=>{});
    fetch(`${API}/api/grinder/history/${setup}`).then(r=>r.json()).then(d=>setGrindHistory(d.runs||[])).catch(()=>{});
  }, [setup]);

  const vetting = pipe?.steps?.find(s=>s.id==='sample_expansion');
  const vs = vetting?.state?.vetting_stats;
  const grind = pipe?.steps?.find(s=>s.id==='signal_brute');

  // Dataset metrics
  const n = examples.length;
  const tickers = new Set(examples.map(e=>e.ticker)).size;
  const adrs = examples.filter(e=>e.adrMove!=null).map(e=>e.adrMove).sort((a,b)=>a-b);
  const medianAdr = adrs.length > 0 ? adrs[Math.floor(adrs.length/2)] : 0;
  const minAdr = adrs.length > 0 ? adrs[0] : 0;
  const dates = examples.map(e=>e.entryDate).sort();
  const dateSpanYrs = dates.length >= 2 ? (new Date(dates[dates.length-1]) - new Date(dates[0])) / (365.25*86400000) : 0;
  const tickerRatio = n > 0 ? tickers / n : 0;
  const hasGrind = grind?.state?.status === 'done';

  // Convergence metrics (from grind history)
  const gh = grindHistory;
  const nRuns = gh.length;
  let condStability = 0, sigStability = 0, condOverlap = 0;
  if (nRuns >= 2) {
    const last = gh[nRuns-1], prev = gh[nRuns-2];
    // Condition count change
    const condDelta = Math.abs(last.n_conditions - prev.n_conditions);
    const maxCond = Math.max(last.n_conditions, prev.n_conditions, 1);
    condStability = Math.max(0, Math.round(100 - (condDelta / maxCond) * 200));
    // Signal count change
    const sigDelta = Math.abs(last.final_total - prev.final_total);
    const maxSig = Math.max(last.final_total, prev.final_total, 1);
    sigStability = Math.max(0, Math.round(100 - (sigDelta / maxSig) * 150));
    // Condition overlap (how many expressions are shared)
    const prevSet = new Set(prev.conditions || []);
    const lastSet = new Set(last.conditions || []);
    const shared = [...lastSet].filter(c => prevSet.has(c)).length;
    const unionSize = new Set([...prevSet, ...lastSet]).size || 1;
    condOverlap = Math.round((shared / unionSize) * 100);
  }

  // Vetting yield
  const vettingYield = vs && vs.n_vetted > 0
    ? Math.round((vs.n_no / vs.n_vetted) * 100)
    : 0;

  // Score components
  const diversityScore = Math.min(100, Math.round(tickerRatio * 120));
  const spreadScore = Math.min(100, Math.round(dateSpanYrs * 25));
  const moveScore = Math.min(100, Math.round(minAdr * 20));
  const convergenceScore = nRuns >= 2 ? Math.round((condStability + sigStability + condOverlap) / 3) : 0;
  const yieldScore = vs && vs.n_vetted >= 10 ? vettingYield : 0;

  const overall = nRuns >= 2
    ? Math.round(diversityScore*0.10 + spreadScore*0.10 + moveScore*0.10 + convergenceScore*0.45 + yieldScore*0.15)
    : Math.round(diversityScore*0.20 + spreadScore*0.20 + moveScore*0.20 + (hasGrind?20:0));
  const grade = overall >= 85 ? 'A' : overall >= 70 ? 'B' : overall >= 55 ? 'C' : overall >= 40 ? 'D' : 'F';
  const gradeColor = overall >= 70 ? 'var(--green)' : overall >= 50 ? 'var(--amber)' : 'var(--red)';
  const readiness = overall >= 80 ? 'Ready for live' : overall >= 60 ? 'Getting close — keep cycling' : overall >= 40 ? 'Needs more vetting cycles' : 'Early stage — collect examples';

  const scoreBar = (label, val, note) => (
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
      <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)',width:90,flexShrink:0}}>{label}</span>
      <div style={{flex:1,height:6,background:'var(--surface-3)',borderRadius:3,overflow:'hidden'}}>
        <div style={{width:`${val}%`,height:'100%',borderRadius:3,
          background:val>=70?'var(--green)':val>=50?'var(--amber)':'var(--red)',transition:'width 0.3s'}} />
      </div>
      <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-dim)',width:28,textAlign:'right'}}>{val}</span>
      {note && <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text-muted)',width:90,flexShrink:0}}>{note}</span>}
    </div>
  );

  return (
    <div>
      <div className="stat-row" style={{marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-label">Quality</div>
          <div className="stat-val" style={{color:gradeColor,fontSize:24}}>{grade}</div>
          <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)',marginTop:2}}>{overall}/100</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Samples</div>
          <div className="stat-val green">{n}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Grinds</div>
          <div className="stat-val blue">{nRuns}</div>
        </div>
        {nRuns >= 2 && (
          <div className="stat-box">
            <div className="stat-label">Convergence</div>
            <div className="stat-val" style={{color:convergenceScore>=70?'var(--green)':convergenceScore>=40?'var(--amber)':'var(--red)'}}>{convergenceScore}%</div>
          </div>
        )}
        {vs && vs.n_vetted > 0 && (
          <div className="stat-box">
            <div className="stat-label">Vetting NO%</div>
            <div className="stat-val" style={{color:vettingYield>=80?'var(--green)':vettingYield>=50?'var(--amber)':'var(--red)'}}>{vettingYield}%</div>
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:12}}>
        <div className="card-title" style={{marginBottom:8}}>Dataset Quality — <span style={{color:gradeColor,fontWeight:400}}>{readiness}</span></div>
        {scoreBar('Diversity', diversityScore, `${tickers} tickers`)}
        {scoreBar('Date Spread', spreadScore, `${dateSpanYrs.toFixed(1)}yr`)}
        {scoreBar('Move Floor', moveScore, `${minAdr} ADR`)}
        {nRuns >= 2 && scoreBar('Cond Stability', condStability, `Δ${Math.abs((gh[nRuns-1]?.n_conditions||0)-(gh[nRuns-2]?.n_conditions||0))} conds`)}
        {nRuns >= 2 && scoreBar('Sig Stability', sigStability, `Δ${Math.abs((gh[nRuns-1]?.final_total||0)-(gh[nRuns-2]?.final_total||0))} sigs`)}
        {nRuns >= 2 && scoreBar('Cond Overlap', condOverlap, `${Math.round(condOverlap)}% shared`)}
        {vs && vs.n_vetted >= 10 && scoreBar('Vetting Yield', yieldScore, `${vs.n_no}/${vs.n_vetted} NO`)}
        {nRuns < 2 && (
          <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)',marginTop:8,fontStyle:'italic'}}>
            Need 2+ grind runs to show convergence metrics. Run grind → vet → add examples → re-grind.
          </div>
        )}
      </div>

      {nRuns > 0 && (
        <div className="card" style={{marginBottom:12}}>
          <div className="card-title">Grind History</div>
          <div style={{fontFamily:'var(--mono)',fontSize:10,overflowX:'auto'}}>
            <div style={{display:'grid',gridTemplateColumns:'auto repeat(4,1fr)',gap:'4px 12px',color:'var(--text-muted)',marginBottom:4}}>
              <span>Run</span><span>Examples</span><span>Conditions</span><span>Signals</span><span>Peak</span>
            </div>
            {gh.map((r,i) => (
              <div key={i} style={{display:'grid',gridTemplateColumns:'auto repeat(4,1fr)',gap:'4px 12px',color:'var(--text-dim)'}}>
                <span style={{color:'var(--text-muted)'}}>#{i+1}</span>
                <span>{r.n_examples}</span>
                <span>{r.n_conditions}</span>
                <span>{r.final_total}</span>
                <span>{r.final_peak}/day</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">Pipeline Status</div>
        {pipe?.steps?.filter(s=>s.id!=='nightly').map(s => (
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',
            fontFamily:'var(--mono)',fontSize:11,color:'var(--text-dim)'}}>
            <span className={`badge b-${s.state?.status||'pending'}`}>{s.state?.status||'pending'}</span>
            <span>{s.name}</span>
            {s.state?.duration_s && <span style={{marginLeft:'auto',color:'var(--text-muted)',fontSize:10}}>{fmtDur(s.state.duration_s)}</span>}
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-title">Optimal Samples ({examples.length})</div>
        <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-dim)',lineHeight:1.8}}>
          {examples.map(e => `${e.ticker} ${e.entryDate}`).join(' · ')}
        </div>
      </div>
    </div>
  );
}

function WatchlistPage() {
  return <div className="empty-state"><div className="icon">📋</div>Daily Watchlist — coming soon<div style={{fontSize:10,color:'var(--text-muted)'}}>Needs market grinder results for EV ranking</div></div>;
}

// ═══════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════
function App() {
  const [section, setSection] = useState('setup'); // 'nightly' | 'setup' | 'watchlist'
  const [setup, setSetup] = useState('dtss');
  const [tab, setTab] = useState('home');
  const [agentOnline, setAgentOnline] = useState(false);

  useEffect(() => {
    const check = () => fetch(`${API}/api/pipeline/steps`).then(r=>r.json())
      .then(d=>setAgentOnline(d.agent_status==='online')).catch(()=>setAgentOnline(false));
    check(); const id = setInterval(check, 5000); return ()=>clearInterval(id);
  }, []);

  const setupSteps = [
    { id:'home', label:'Home', icon:'◉' },
    { id:'optimal_samples', label:'Optimal Samples', num:'1' },
    { id:'signal_brute', label:'Signal Brute Forcing', num:'2' },
    { id:'sample_expansion', label:'Sample Expansion', num:'3' },
    { id:'setup_grinder_a', label:'Exit Grinder', num:'4a' },
    { id:'setup_grinder_b', label:'Setup Grinder', num:'4b' },
    { id:'market_grind', label:'Market Grinder', num:'5' },
  ];

  const titles = {
    nightly: 'Nightly Refresh',
    home: `${setup.toUpperCase()} — Overview`,
    optimal_samples: `${setup.toUpperCase()} — Optimal Samples`,
    signal_brute: `${setup.toUpperCase()} — Signal Brute Forcing`,
    sample_expansion: `${setup.toUpperCase()} — Sample Expansion`,
    setup_grinder_a: `${setup.toUpperCase()} — Exit Grinder`,
    setup_grinder_b: `${setup.toUpperCase()} — Setup Grinder`,
    market_grind: `${setup.toUpperCase()} — Market Grinder`,
    watchlist: 'Daily Watchlist',
  };

  const currentTitle = section === 'nightly' ? titles.nightly
    : section === 'watchlist' ? titles.watchlist
    : titles[tab] || '';

  return (
    <div className="app">
      {/* Rail */}
      <div className="rail">
        <div className="rail-logo">SP</div>
        <button className={`rail-btn ${section==='nightly'?'on':''}`} onClick={()=>setSection('nightly')} title="Nightly Refresh">🌙</button>
        <button className={`rail-btn ${section==='setup'?'on':''}`} onClick={()=>setSection('setup')} title="Setup Analysis">⚡</button>
        <button className={`rail-btn ${section==='watchlist'?'on':''}`} onClick={()=>setSection('watchlist')} title="Daily Watchlist">📋</button>
        <div className={`rail-agent ${agentOnline?'online':''}`} title={agentOnline?'Agent online':'Agent offline'}></div>
      </div>

      {/* Sidebar (only for setup analysis) */}
      {section === 'setup' && (
        <div className="sidebar">
          <div className="sb-hdr">SETUP ANALYSIS</div>
          <div className="sb-setup-sel">
            <button className={`sb-setup-btn ${setup==='dtss'?'on':''}`} onClick={()=>{setSetup('dtss');setTab('home');}}>DTSS</button>
            <button className={`sb-setup-btn ${setup==='3-4db'?'on':''}`} onClick={()=>{setSetup('3-4db');setTab('home');}}>3-4DB</button>
          </div>
          <div className="sb-section">
            {setupSteps.map(s => (
              <div key={s.id} className={`sb-item ${tab===s.id?'on':''}`} onClick={()=>setTab(s.id)}>
                {s.num ? <span className="num">{s.num}</span> : null}
                {s.icon && !s.num ? <span style={{fontSize:11}}>{s.icon}</span> : null}
                <span>{s.label}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Main */}
      <div className="main">
        <div className="main-hdr">
          <div className="main-title">{currentTitle}</div>
          <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text-muted)'}}>
            {new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
          </div>
        </div>
        <div className="main-body">
          {section === 'nightly' && <NightlyPage />}
          {section === 'watchlist' && <WatchlistPage />}
          {section === 'setup' && tab === 'home' && <SetupHomePage setup={setup} />}
          {section === 'setup' && tab === 'optimal_samples' && <ExamplesPage setup={setup} />}
          {section === 'setup' && tab === 'signal_brute' && <StepPage stepId="signal_brute" setup={setup} />}
          {section === 'setup' && tab === 'sample_expansion' && <VettingPage setup={setup} />}
          {section === 'setup' && tab === 'setup_grinder_a' && <ExitGrinderPage setup={setup} />}
          {section === 'setup' && tab === 'setup_grinder_b' && <StepPage stepId="setup_grinder_b" setup={setup} />}
          {section === 'setup' && tab === 'market_grind' && <div className="empty-state"><div className="icon">🌍</div>Market Grinder — coming soon</div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>

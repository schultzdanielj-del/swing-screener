<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:14px;">
  <div class="row" style="gap:8px;flex-wrap:wrap;">
    <span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--up-soft);color:var(--up);border-radius:10px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">● LONG</span>
    <span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--down-soft);color:var(--down);border-radius:10px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">● SHORT</span>
    <span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border);border-radius:10px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">FLAT</span>
    <span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--warn-soft);color:var(--warn);border-radius:10px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">HALTED</span>
    <span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--info-soft);color:var(--info);border-radius:10px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">NEWS</span>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap;">
    <span style="padding:1px 6px;background:transparent;color:var(--up);border:1px solid var(--up);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;">BULLISH</span>
    <span style="padding:1px 6px;background:transparent;color:var(--down);border:1px solid var(--down);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;">BEARISH</span>
    <span style="padding:1px 6px;background:transparent;color:var(--fg-secondary);border:1px solid var(--border);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;">NEUTRAL</span>
    <span style="padding:1px 6px;background:transparent;color:var(--warn);border:1px solid var(--warn);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;">MIXED</span>
    <span style="padding:1px 6px;background:var(--accent);color:var(--fg-on-accent);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:700;">LIVE</span>
    <span style="padding:1px 6px;background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border);border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;">PAPER</span>
  </div>
</div></body></html>

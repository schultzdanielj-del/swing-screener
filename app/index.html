<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swing Screener</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2035;
      --bg-card-hover: #1e2642;
      --border: #2a3550;
      --border-active: #3b82f6;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #26A69A;
      --accent-red: #EF5350;
      --accent-yellow: #f59e0b;
      --accent-pink: #ec4899;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    #root { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-logo {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      color: var(--accent-blue);
      letter-spacing: -0.5px;
    }
    .sidebar-logo span { color: var(--text-muted); font-weight: 400; }
    .nav-section {
      padding: 16px 12px 8px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.15s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .nav-item.active {
      background: rgba(59,130,246,0.08);
      color: var(--accent-blue);
      border-left-color: var(--accent-blue);
    }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-badge {
      margin-left: auto;
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .nav-item.active .nav-badge { background: rgba(59,130,246,0.15); color: var(--accent-blue); }

    /* Main content */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; }

    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Buttons */
    .btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
    .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tables */
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(42,53,80,0.5);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .table tr:hover td { background: rgba(59,130,246,0.03); }

    /* Status badges */
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .badge-pass { background: rgba(38,166,154,0.15); color: var(--accent-green); }
    .badge-fail { background: rgba(239,83,80,0.15); color: var(--accent-red); }
    .badge-warn { background: rgba(245,158,11,0.15); color: var(--accent-yellow); }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      text-align: center;
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state-desc { font-size: 13px; max-width: 360px; line-height: 1.6; }

    /* Setup type tabs */
    .setup-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .setup-tab {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-mono);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .setup-tab:hover { color: var(--text-secondary); border-color: var(--text-muted); }
    .setup-tab.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .stat-value { font-size: 24px; font-weight: 700; font-family: var(--font-mono); margin-top: 4px; }

    /* Feature placeholder */
    .feature-placeholder {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .feature-placeholder-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;

    // ============================================
    // DATA LAYER — setup types, examples, conditions
    // ============================================
    const SETUP_TYPES = {
      '3-4db': { name: '3-4DB', desc: '3-4 Day Bounce (Short)', color: '#EF5350' },
      'dtss':  { name: 'DTSS',  desc: 'Double Top Short Sell', color: '#ec4899' },
      'htf':   { name: 'HTF',   desc: 'High Tight Flag (Long)', color: '#26A69A' },
    };

    // ============================================
    // NAV PAGES
    // ============================================
    const PAGES = [
      { id: 'dashboard',  label: 'Dashboard',    icon: '◫', section: 'overview' },
      { id: 'examples',   label: 'Examples',     icon: '◉', section: 'manage' },
      { id: 'add',        label: 'Add Example',  icon: '＋', section: 'manage' },
      { id: 'conditions', label: 'Conditions',   icon: '⚙', section: 'manage' },
      { id: 'validate',   label: 'Validate',     icon: '✓', section: 'tools' },
    ];

    // ============================================
    // PLACEHOLDER COMPONENT
    // ============================================
    function FeaturePlaceholder({ number, title, description }) {
      return (
        <div className="feature-placeholder">
          <span className="feature-placeholder-num">FEATURE {number}</span>
          <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--text-secondary)' }}>{title}</div>
          <div style={{ fontSize: 13, maxWidth: 400, lineHeight: 1.6 }}>{description}</div>
        </div>
      );
    }

    // ============================================
    // DASHBOARD PAGE
    // ============================================
    function DashboardPage({ setPage }) {
      return (
        <div>
          <div className="stats-row">
            <div className="stat-card">
              <div className="stat-label">Setup Types</div>
              <div className="stat-value">{Object.keys(SETUP_TYPES).length}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">3-4DB Examples</div>
              <div className="stat-value" style={{ color: 'var(--accent-green)' }}>19</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Active Conditions</div>
              <div className="stat-value" style={{ color: 'var(--accent-blue)' }}>9</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Pass Rate</div>
              <div className="stat-value" style={{ color: 'var(--accent-green)' }}>100%</div>
            </div>
          </div>

          <div className="card" style={{ marginBottom: 16 }}>
            <div className="card-title">⚡ Quick Actions</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <button className="btn" onClick={() => setPage('add')}>＋ Add Example</button>
              <button className="btn" onClick={() => setPage('validate')}>✓ Run Validation</button>
              <button className="btn" onClick={() => setPage('conditions')}>⚙ Edit Conditions</button>
            </div>
          </div>

          <div className="card">
            <div className="card-title">📋 Setup Types</div>
            <table className="table">
              <thead>
                <tr>
                  <th>Setup</th>
                  <th>Type</th>
                  <th>Examples</th>
                  <th>Conditions</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td style={{ fontWeight: 600, color: 'var(--text-primary)' }}>3-4DB</td>
                  <td>Short</td>
                  <td>19</td>
                  <td>9</td>
                  <td><span className="badge badge-pass">ACTIVE</span></td>
                </tr>
                <tr>
                  <td style={{ fontWeight: 600, color: 'var(--text-primary)' }}>DTSS</td>
                  <td>Short</td>
                  <td>0</td>
                  <td>0</td>
                  <td><span className="badge badge-warn">PENDING</span></td>
                </tr>
                <tr>
                  <td style={{ fontWeight: 600, color: 'var(--text-primary)' }}>HTF</td>
                  <td>Long</td>
                  <td>0</td>
                  <td>0</td>
                  <td><span className="badge badge-warn">PENDING</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ============================================
    // EXAMPLES PAGE
    // ============================================
    function ExamplesPage({ activeSetup }) {
      return (
        <div>
          <div className="setup-tabs">
            {Object.entries(SETUP_TYPES).map(([key, s]) => (
              <div key={key} className={`setup-tab ${key === activeSetup ? 'active' : ''}`}>
                {s.name}
              </div>
            ))}
          </div>

          <div className="card">
            <div className="card-title">Examples — {SETUP_TYPES[activeSetup].name}</div>
            {activeSetup === '3-4db' ? (
              <table className="table">
                <thead>
                  <tr>
                    <th>Ticker</th>
                    <th>Entry Date</th>
                    <th>Signal Date</th>
                    <th>Close</th>
                    <th>ATR</th>
                    <th>Conditions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td style={{color:'var(--text-primary)'}}>CLSK</td><td>2025-10-28</td><td>2025-10-27</td><td>$12.45</td><td>1.23</td><td><span className="badge badge-pass">9/9</span></td></tr>
                  <tr><td style={{color:'var(--text-primary)'}}>APP</td><td>2025-10-28</td><td>2025-10-27</td><td>$312.50</td><td>28.4</td><td><span className="badge badge-pass">9/9</span></td></tr>
                  <tr><td style={{color:'var(--text-primary)'}}>OKLO</td><td>2025-10-27</td><td>2025-10-24</td><td>$34.20</td><td>3.85</td><td><span className="badge badge-pass">9/9</span></td></tr>
                </tbody>
              </table>
            ) : (
              <div className="empty-state">
                <div className="empty-state-icon">📊</div>
                <div className="empty-state-title">No examples yet</div>
                <div className="empty-state-desc">Add your first {SETUP_TYPES[activeSetup].name} example to start building conditions.</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================
    // ADD EXAMPLE PAGE — Feature 1 & 2 placeholder
    // ============================================
    function AddExamplePage() {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <FeaturePlaceholder
            number={1}
            title="Upload Screenshot"
            description="Upload a TC2000 chart screenshot. The app extracts the ticker and date from the header, pulls OHLCV data via yfinance, generates an interactive candlestick chart, and you click the entry candle."
          />
          <FeaturePlaceholder
            number={2}
            title="Manual Entry"
            description="Enter ticker + entry date + setup type directly. OHLCV data is auto-pulled and the example is validated against the current ruleset immediately."
          />
        </div>
      );
    }

    // ============================================
    // CONDITIONS PAGE — Feature 4 placeholder
    // ============================================
    function ConditionsPage({ activeSetup }) {
      return (
        <div>
          <div className="setup-tabs">
            {Object.entries(SETUP_TYPES).map(([key, s]) => (
              <div key={key} className={`setup-tab ${key === activeSetup ? 'active' : ''}`}>
                {s.name}
              </div>
            ))}
          </div>

          {activeSetup === '3-4db' ? (
            <div className="card">
              <div className="card-title">⚙ Scan Conditions — 3-4DB</div>
              <table className="table">
                <thead>
                  <tr><th>#</th><th>Name</th><th>PCF</th><th>Hit Rate</th><th>Status</th></tr>
                </thead>
                <tbody>
                  <tr><td>1</td><td>Close above 50 SMA</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>C &gt; AVGC50</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>2</td><td>50 SMA rising</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>AVGC50 &gt; AVGC50.5</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>3</td><td>Extended above 50 SMA</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>C - AVGC50 &gt; 0.3 * AVGT14</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>4</td><td>2 of 3 up closes</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>IIF sum &gt;= 2</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>5</td><td>Off the low</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>MINL3 &lt; MINL2</td><td>18/19</td><td><span className="badge badge-warn">95%</span></td></tr>
                  <tr><td>6</td><td>Bounced from low</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>C - MINL10 &gt; 0.8 * AVGT14</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>7</td><td>Below prior high</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>MAXH15 - C &gt; 0.3 * AVGT14</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>8</td><td>Had close below 8 EMA</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>C1 &lt; XAVGC8.1 OR ...</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                  <tr><td>9</td><td>Not at new highs</td><td style={{fontFamily:'var(--font-mono)',fontSize:11}}>MAXH15.2 &gt; MAXH2</td><td>19/19</td><td><span className="badge badge-pass">100%</span></td></tr>
                </tbody>
              </table>
            </div>
          ) : (
            <div className="card">
              <div className="empty-state">
                <div className="empty-state-icon">⚙</div>
                <div className="empty-state-title">No conditions defined</div>
                <div className="empty-state-desc">Add examples first, then build conditions for {SETUP_TYPES[activeSetup].name}.</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // VALIDATE PAGE — Feature 4 placeholder
    // ============================================
    function ValidatePage() {
      return (
        <div>
          <FeaturePlaceholder
            number={4}
            title="Auto-Validate All Examples"
            description="Run every example through the current ruleset. Shows pass/fail per condition per example. Validates automatically on any ruleset update. Zero false negatives is the target."
          />
        </div>
      );
    }

    // ============================================
    // APP SHELL
    // ============================================
    function App() {
      const [page, setPage] = useState('dashboard');
      const [activeSetup, setActiveSetup] = useState('3-4db');

      const currentPage = PAGES.find(p => p.id === page);
      let sections = {};
      PAGES.forEach(p => {
        if (!sections[p.section]) sections[p.section] = [];
        sections[p.section].push(p);
      });

      const sectionLabels = { overview: 'Overview', manage: 'Manage', tools: 'Tools' };

      return (
        <>
          <div className="sidebar">
            <div className="sidebar-logo">
              swing<span>/</span>screener
            </div>
            {Object.entries(sections).map(([section, pages]) => (
              <React.Fragment key={section}>
                <div className="nav-section">{sectionLabels[section]}</div>
                {pages.map(p => (
                  <div
                    key={p.id}
                    className={`nav-item ${page === p.id ? 'active' : ''}`}
                    onClick={() => setPage(p.id)}
                  >
                    <span className="nav-icon">{p.icon}</span>
                    {p.label}
                    {p.id === 'examples' && <span className="nav-badge">19</span>}
                    {p.id === 'conditions' && <span className="nav-badge">9</span>}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
          <div className="main">
            <div className="topbar">
              <div className="topbar-title">{currentPage?.label}</div>
              <div className="topbar-actions">
                <div className="setup-tabs" style={{ marginBottom: 0 }}>
                  {Object.entries(SETUP_TYPES).map(([key, s]) => (
                    <div
                      key={key}
                      className={`setup-tab ${key === activeSetup ? 'active' : ''}`}
                      onClick={() => setActiveSetup(key)}
                      style={{ padding: '5px 12px', fontSize: 12 }}
                    >
                      {s.name}
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="content">
              {page === 'dashboard' && <DashboardPage setPage={setPage} />}
              {page === 'examples' && <ExamplesPage activeSetup={activeSetup} />}
              {page === 'add' && <AddExamplePage />}
              {page === 'conditions' && <ConditionsPage activeSetup={activeSetup} />}
              {page === 'validate' && <ValidatePage />}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

# Swing Screener Configuration

chart:
  # Number of trading days to display
  lookback_days: 120
  
  # Moving averages to overlay
  moving_averages:
    - period: 8
      type: "ema"
      color: "#ADD8E6"    # Light blue
      width: 1.0
    - period: 21
      type: "ema"
      color: "#D2B48C"    # Tan
      width: 1.0
    - period: 50
      type: "sma"
      color: "#FFD700"    # Yellow
      width: 1.2
    - period: 200
      type: "sma"
      color: "#FF0000"    # Red
      width: 1.5
  
  # Volume settings
  volume: true
  
  # Image output
  width: 12
  height: 7
  dpi: 150
  style: "nightclouds"    # Dark background

output:
  charts_dir: "output/charts"
  results_dir: "output/results"

batch:
  # Max charts per Claude vision batch
  size: 20

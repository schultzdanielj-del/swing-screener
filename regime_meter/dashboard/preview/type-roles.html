<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:12px;">
  <div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:baseline;">
    <span class="label">Display</span><span class="t-display">+12.4%</span>
    <span class="label">H1</span><span class="t-h1">Day's leaders</span>
    <span class="label">H2</span><span class="t-h2">Filter results</span>
    <span class="label">H3</span><span class="t-h3">Open positions</span>
    <span class="label">Body</span><span class="t-body">Filters matched 47 of 4,238 symbols on US listed equities.</span>
    <span class="label">Small</span><span class="t-small">Last scan: 14:32 ET · 124ms</span>
    <span class="label">Caption</span><span class="t-caption">Right-click a row to copy ticker</span>
    <span class="label">Panel title</span><span class="t-panel-title">SCANNER RESULTS</span>
    <span class="label">Col header</span><span class="t-col-header">LAST · CHG% · RVOL</span>
  </div>
</div></body></html>

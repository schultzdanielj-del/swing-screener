<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;">
  <div style="background:var(--bg-elevated);padding:8px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);">
    <span style="font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:0.02em;">AAPL</span>
    <span class="mono up" style="font-size:13px;">184.27 · +5.14 +2.84%</span>
    <span style="margin-left:auto;display:inline-flex;gap:1px;border:1px solid var(--border);border-radius:2px;overflow:hidden;">
      <span style="padding:2px 8px;font-family:var(--font-mono);font-size:11px;background:var(--bg-canvas);color:var(--fg-secondary);">1D</span>
      <span style="padding:2px 8px;font-family:var(--font-mono);font-size:11px;background:var(--accent);color:var(--fg-on-accent);font-weight:600;">5D</span>
      <span style="padding:2px 8px;font-family:var(--font-mono);font-size:11px;background:var(--bg-canvas);color:var(--fg-secondary);">1M</span>
      <span style="padding:2px 8px;font-family:var(--font-mono);font-size:11px;background:var(--bg-canvas);color:var(--fg-secondary);">3M</span>
      <span style="padding:2px 8px;font-family:var(--font-mono);font-size:11px;background:var(--bg-canvas);color:var(--fg-secondary);">1Y</span>
    </span>
  </div>
  <img src="../assets/chart-sample.svg" style="width:100%;display:block;"/>
</div></body></html>

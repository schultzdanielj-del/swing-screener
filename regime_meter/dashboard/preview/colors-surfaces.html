<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;">

  <div class="swatch-block">
    <div class="swatch" style="height:60px;background:#0a0d12;"></div>
    <div class="meta"><div class="name">Canvas</div><div class="hex">#0a0d12</div><div class="hex" style="color:var(--fg-secondary)">--bg-canvas</div></div>
  </div>
  <div class="swatch-block">
    <div class="swatch" style="height:60px;background:#0f141b;"></div>
    <div class="meta"><div class="name">Panel</div><div class="hex">#0f141b</div><div class="hex" style="color:var(--fg-secondary)">--bg-panel</div></div>
  </div>
  <div class="swatch-block">
    <div class="swatch" style="height:60px;background:#161c25;"></div>
    <div class="meta"><div class="name">Elevated</div><div class="hex">#161c25</div><div class="hex" style="color:var(--fg-secondary)">--bg-elevated</div></div>
  </div>
  <div class="swatch-block">
    <div class="swatch" style="height:60px;background:#1d2530;"></div>
    <div class="meta"><div class="name">Overlay</div><div class="hex">#1d2530</div><div class="hex" style="color:var(--fg-secondary)">--bg-overlay</div></div>
  </div>
  <div class="swatch-block">
    <div class="swatch" style="height:60px;background:#131923;"></div>
    <div class="meta"><div class="name">Row hover</div><div class="hex">#131923</div><div class="hex" style="color:var(--fg-secondary)">--bg-row-hover</div></div>
  </div>
</div></body></html>

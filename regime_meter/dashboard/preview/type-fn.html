<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:14px;">
  <div class="row" style="gap:8px;"><span class="t-fn">EQS</span><span class="t-fn">HELP</span><span class="t-fn">GO</span><span class="t-fn">SCAN</span><span class="sub" style="margin-left:auto;">Function codes (mono · upper · bordered)</span></div>
  <div class="row" style="gap:6px;">
    <span class="t-fn">⌘</span><span class="t-fn">K</span><span class="sub" style="margin-left:4px;">Open command palette</span>
    <span style="margin-left:auto;"></span>
    <span class="t-fn">/</span><span class="sub" style="margin-left:4px;">Focus search</span>
  </div>
  <div class="row" style="gap:8px;">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:2px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:0.02em;">AAPL</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:2px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:0.02em;">NVDA</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:2px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:0.02em;">SPY</span>
    <span class="sub" style="margin-left:auto;">Ticker chips (sharp 2px corners)</span>
  </div>
</div></body></html>

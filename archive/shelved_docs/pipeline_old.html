<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — Swing Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090b;
    --surface: #0f1114;
    --surface-2: #151719;
    --surface-3: #1b1d21;
    --border: #232529;
    --border-bright: #35373d;
    --text: #e8eaed;
    --text-dim: #9ca0a8;
    --text-muted: #62656d;
    --green: #34d399;
    --green-dark: #059669;
    --green-bg: rgba(52,211,153,0.07);
    --red: #f87171;
    --red-dark: #dc2626;
    --red-bg: rgba(248,113,113,0.07);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.07);
    --blue: #60a5fa;
    --blue-bg: rgba(96,165,250,0.07);
    --cyan: #22d3ee;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hdr-left { display:flex; align-items:center; gap:14px; }

  .agent-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--red-dark);
    transition: background 0.4s;
    flex-shrink: 0;
  }
  .agent-dot.online { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.4); }

  header h1 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }
  header h1 span { color: var(--text-muted); font-weight: 400; }

  .agent-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .agent-label.online { color: var(--green); border-color: rgba(52,211,153,0.25); }

  .hdr-right {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-link {
    color: var(--blue);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 11px;
  }
  .back-link:hover { text-decoration: underline; }

  /* ── Layout ──────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 57px);
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .detail { border-top: 1px solid var(--border); }
  }

  /* ── Steps Panel ─────────────────────── */
  .steps {
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .steps::-webkit-scrollbar { width:4px; }
  .steps::-webkit-scrollbar-thumb { background:var(--border-bright); border-radius:2px; }

  .cat-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 18px 22px 6px;
  }

  .step {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .step:hover { background: var(--surface); }
  .step.sel { background: var(--surface-2); }
  .step.sel::after {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:3px; background:var(--blue);
  }

  .step-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }

  .step-nm {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .b-pending { color:var(--text-muted); background:var(--surface-3); }
  .b-queued { color:var(--amber); background:var(--amber-bg); animation:blink 1.5s infinite; }
  .b-claimed { color:var(--amber); background:var(--amber-bg); animation:blink 1.5s infinite; }
  .b-running { color:var(--amber); background:var(--amber-bg); animation:blink 1.5s infinite; }
  .b-done { color:var(--green); background:var(--green-bg); }
  .b-error { color:var(--red); background:var(--red-bg); }
  .b-stopped { color:var(--text-muted); background:var(--surface-3); }

  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .step-desc {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.35;
  }

  .step-dur {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .running-bar {
    position:absolute; bottom:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    animation: slide 1.5s infinite linear;
  }
  @keyframes slide { from{transform:translateX(-100%);} to{transform:translateX(100%);} }

  /* ── Detail Panel ────────────────────── */
  .detail {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .empty {
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--text-muted);
    font-family:var(--mono); font-size:13px;
  }

  .det-hdr {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .det-title { font-family:var(--mono); font-size:13px; font-weight:600; }

  .det-btns { display:flex; gap:6px; }

  .btn {
    font-family:var(--mono); font-size:11px; font-weight:600;
    padding:6px 14px; border:1px solid var(--border-bright);
    border-radius:4px; cursor:pointer; transition:all 0.12s;
    background:var(--surface-2); color:var(--text-dim);
  }
  .btn:hover:not(:disabled) { background:var(--surface-3); color:var(--text); border-color:var(--text-muted); }
  .btn:disabled { opacity:0.25; cursor:not-allowed; }
  .btn-go { background:var(--green-dark); border-color:var(--green); color:#fff; }
  .btn-go:hover:not(:disabled) { background:var(--green); }
  .btn-stop { background:var(--red-dark); border-color:var(--red); color:#fff; }
  .btn-stop:hover:not(:disabled) { background:var(--red); }

  /* ── Tabs ─────────────────────────────── */
  .tabs {
    display:flex; border-bottom:1px solid var(--border);
    padding:0 24px; flex-shrink:0;
  }
  .tab {
    font-family:var(--mono); font-size:11px; font-weight:500;
    padding:9px 14px; color:var(--text-muted); cursor:pointer;
    border-bottom:2px solid transparent; transition:all 0.12s;
  }
  .tab:hover { color:var(--text-dim); }
  .tab.on { color:var(--text); border-bottom-color:var(--blue); }

  .tpane { flex:1; overflow:hidden; display:none; flex-direction:column; }
  .tpane.on { display:flex; }

  /* ── Logs ─────────────────────────────── */
  .logs {
    flex:1; overflow-y:auto; padding:14px 24px;
    font-family:var(--mono); font-size:11px; line-height:1.55;
    color:var(--text-dim); background:var(--bg);
  }
  .logs::-webkit-scrollbar { width:5px; }
  .logs::-webkit-scrollbar-thumb { background:var(--border-bright); border-radius:3px; }

  .ll { white-space:pre-wrap; word-break:break-all; }
  .ll.ok { color:var(--green); font-weight:500; }
  .ll.err { color:var(--red); }
  .log-ph { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); }

  /* ── Info tab ─────────────────────────── */
  .info { flex:1; overflow-y:auto; padding:18px 24px; }

  .isec { margin-bottom:20px; }
  .ilbl {
    font-family:var(--mono); font-size:9px; font-weight:600;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted);
    margin-bottom:6px;
  }
  .ival {
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    background:var(--surface); padding:8px 12px; border-radius:4px;
    border:1px solid var(--border); word-break:break-all;
  }
  .ival.cmd { color:var(--cyan); font-size:11px; user-select:all; }

  .prereqs { display:flex; flex-direction:column; gap:5px; }
  .pq {
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:11px;
  }
  .pq-c {
    width:15px; height:15px; border-radius:3px;
    border:1px solid var(--border-bright);
    display:flex; align-items:center; justify-content:center;
    font-size:9px;
  }
  .pq-c.y { border-color:var(--green); color:var(--green); background:var(--green-bg); }
  .pq-c.n { border-color:var(--red); color:var(--red); background:var(--red-bg); }

  .sum-box {
    font-family:var(--mono); font-size:11px; line-height:1.5;
    color:var(--green); background:var(--green-bg);
    padding:10px 12px; border-radius:4px;
    border:1px solid rgba(52,211,153,0.12);
    white-space:pre-wrap;
  }
  .err-box {
    font-family:var(--mono); font-size:11px; line-height:1.5;
    color:var(--red); background:var(--red-bg);
    padding:10px 12px; border-radius:4px;
    border:1px solid rgba(248,113,113,0.12);
    white-space:pre-wrap; max-height:250px; overflow-y:auto;
  }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <div class="agent-dot" id="agentDot"></div>
    <h1>PIPELINE <span>/ swing screener</span></h1>
    <div class="agent-label" id="agentLabel">agent: checking…</div>
  </div>
  <div class="hdr-right">
    <a href="/" class="back-link">← ScanPerfect</a>
    <span id="clock"></span>
  </div>
</header>

<div class="layout">
  <div class="steps" id="stepsPanel"></div>
  <div class="detail" id="detailPanel">
    <div class="empty" id="emptyMsg">Select a pipeline step</div>
    <div id="detWrap" style="display:none;flex-direction:column;height:100%;">
      <div class="det-hdr">
        <div class="det-title" id="detTitle"></div>
        <div class="det-btns" id="detBtns"></div>
      </div>
      <div class="tabs">
        <div class="tab on" data-t="logs" onclick="stab('logs')">Logs</div>
        <div class="tab" data-t="info" onclick="stab('info')">Info</div>
      </div>
      <div class="tpane on" id="tp-logs">
        <div class="logs" id="logBox"><div class="log-ph">No logs yet</div></div>
      </div>
      <div class="tpane" id="tp-info">
        <div class="info" id="infoBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';  // same origin
let data = null;
let sel = null;
let logCursor = {};  // step_id -> last line index
let logPollId = null;

// ── Fetch pipeline state ──────────────
async function load() {
  try {
    const r = await fetch(`${API}/api/pipeline/steps`);
    data = await r.json();
    renderSteps();
    updateAgent();
    if (sel) renderDet();
  } catch(e) { console.error(e); }
}

// ── Fetch logs (polling) ──────────────
async function pollLogs() {
  if (!sel || !data) return;
  const step = data.steps.find(s => s.id === sel);
  if (!step) return;
  const st = step.state?.status;
  // Only active-poll if running
  const cursor = logCursor[sel] || 0;
  try {
    const r = await fetch(`${API}/api/pipeline/logs/${sel}?after=${cursor}`);
    const d = await r.json();
    if (d.lines && d.lines.length > 0) {
      logCursor[sel] = d.total;
      appendLines(d.lines);
    }
  } catch(e) {}
}

// ── Render steps ──────────────────────
function renderSteps() {
  if (!data) return;
  const el = document.getElementById('stepsPanel');
  let h = '';
  let lc = '';
  for (const s of data.steps) {
    if (s.category !== lc) {
      const labels = {data:'Data',grind:'Grinders',analysis:'Analysis'};
      h += `<div class="cat-label">${labels[s.category]||s.category}</div>`;
      lc = s.category;
    }
    const st = s.state?.status || 'pending';
    const isRun = data.running === s.id;
    h += `<div class="step ${sel===s.id?'sel':''}" onclick="pick('${s.id}')">
      ${isRun?'<div class="running-bar"></div>':''}
      <div class="step-top">
        <div class="step-nm">${esc(s.name)}</div>
        <div class="badge b-${st}">${st}</div>
      </div>
      <div class="step-desc">${esc(s.description)}</div>
      ${s.state?.duration_s?`<div class="step-dur">${fmtDur(s.state.duration_s)}</div>`:''}
    </div>`;
  }
  el.innerHTML = h;
}

// ── Render detail ─────────────────────
function renderDet() {
  if (!sel || !data) return;
  const s = data.steps.find(x => x.id === sel);
  if (!s) return;

  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('detWrap').style.display = 'flex';
  document.getElementById('detTitle').textContent = s.name;

  const st = s.state?.status || 'pending';
  const isRun = ['queued','claimed','running'].includes(st);
  const canRun = s.can_run;

  let btns = '';
  if (s.is_manual) {
    // Manual step (vetting) — show link to vetting UI
    btns = `<a href="/vetting.html?setup=dtss" target="_blank" class="btn btn-go" style="text-decoration:none;display:inline-block;">⚡ OPEN VETTING UI</a>
            <button class="btn" onclick="doReset('${s.id}')">↻ Reset</button>`;
  } else if (isRun) {
    btns = `<button class="btn btn-stop" onclick="doStop()">■ STOP</button>`;
  } else {
    const dis = canRun ? '' : 'disabled';
    const tip = canRun ? 'Run this step' : (data.running ? 'Another step is running' : 'Prerequisites not met');
    btns = `<button class="btn btn-go" onclick="doRun('${s.id}')" ${dis} title="${tip}">▶ RUN</button>
            <button class="btn" onclick="doReset('${s.id}')">↻ Reset</button>`;
  }
  document.getElementById('detBtns').innerHTML = btns;

  // Info tab
  renderInfo(s);
}

function renderInfo(s) {
  const st = s.state || {};
  let h = '';

  // Vetting step — show stats instead of command
  if (s.id === 'vetting') {
    const vs = st.vetting_stats;
    if (vs) {
      const pct = vs.n_total > 0 ? Math.round(vs.n_vetted / vs.n_total * 100) : 0;
      h += `<div class="isec"><div class="ilbl">Vetting Progress</div><div class="sum-box">`;
      h += `${vs.n_vetted} / ${vs.n_total} signals vetted (${pct}%)\n`;
      h += `\n✓ YES: ${vs.n_yes}    ? MAYBE: ${vs.n_maybe}    ✗ NO: ${vs.n_no}`;
      h += `\n\nTotal examples in DB: ${vs.n_examples}`;
      h += `Total rejected in DB: ${vs.n_rejected}`;
      h += `</div></div>`;
      h += `<div class="isec"><div class="ilbl">Next Step</div><div class="ival">`;
      h += vs.n_vetted >= vs.n_total
        ? 'All signals vetted. Reset steps 1-3 and re-grind with expanded examples.'
        : 'Continue vetting signals in the Vetting UI.';
      h += `</div></div>`;
    } else {
      h += `<div class="isec"><div class="ilbl">Status</div><div class="ival">Waiting for signal filter to complete.</div></div>`;
    }
    document.getElementById('infoBox').innerHTML = h;
    return;
  }

  // Command
  const cmds = {
    nightly: 'python local_runner/nightly.py',
    signal_grind: 'python local_runner/pyramid_grinder.py --setup dtss --peak-target 3 --beam 10000 --depth 100',
    exit_grind: 'python scripts/signal_exit_grinder.py --setup dtss',
    signal_filter: 'python scripts/signal_filter.py --setup dtss',
    outcome_grind: 'python scripts/outcome_grinder.py --setup dtss',
    backtest: 'python scripts/backtest_runner.py --setup dtss',
  };
  h += `<div class="isec"><div class="ilbl">Command</div><div class="ival cmd">${cmds[s.id]||'—'}</div></div>`;

  // Prerequisites
  if (s.prerequisites.length > 0) {
    h += `<div class="isec"><div class="ilbl">Prerequisites</div><div class="prereqs">`;
    for (const p of s.prerequisites) {
      const ps = data.steps.find(x=>x.id===p);
      const met = ps?.state?.status === 'done';
      h += `<div class="pq"><div class="pq-c ${met?'y':'n'}">${met?'✓':'✗'}</div>
            <span style="color:${met?'var(--green)':'var(--text-muted)'}">${ps?.name||p}</span></div>`;
    }
    h += `</div></div>`;
  }

  // Result files
  if (s.result_files?.length) {
    h += `<div class="isec"><div class="ilbl">Result Files</div>`;
    for (const rf of s.result_files) {
      h += `<div class="ival" style="margin-bottom:4px;font-size:11px;">${rf}</div>`;
    }
    h += `</div>`;
  }

  if (st.result_summary) {
    h += `<div class="isec"><div class="ilbl">Result</div><div class="sum-box">${esc(st.result_summary)}</div></div>`;
  }
  if (st.error) {
    h += `<div class="isec"><div class="ilbl">Error</div><div class="err-box">${esc(st.error)}</div></div>`;
  }
  if (st.started_at) {
    let timing = `Started: ${new Date(st.started_at).toLocaleString()}`;
    if (st.finished_at) timing += `\nFinished: ${new Date(st.finished_at).toLocaleString()}`;
    if (st.duration_s) timing += `\nDuration: ${fmtDur(st.duration_s)}`;
    if (st.exit_code !== null && st.exit_code !== undefined) timing += `\nExit code: ${st.exit_code}`;
    h += `<div class="isec"><div class="ilbl">Timing</div><div class="ival">${esc(timing)}</div></div>`;
  }

  document.getElementById('infoBox').innerHTML = h;
}

// ── Log rendering ─────────────────────
function appendLines(lines) {
  const box = document.getElementById('logBox');
  const ph = box.querySelector('.log-ph');
  if (ph) ph.remove();

  for (const l of lines) {
    const d = document.createElement('div');
    d.className = `ll ${logCls(l)}`;
    d.textContent = l;
    box.appendChild(d);
  }
  // Auto-scroll if near bottom
  if (box.scrollHeight - box.scrollTop - box.clientHeight < 80) {
    box.scrollTop = box.scrollHeight;
  }
}

function clearLogs() {
  const box = document.getElementById('logBox');
  box.innerHTML = '<div class="log-ph">No logs yet</div>';
}

function logCls(t) {
  const l = (t||'').toLowerCase();
  if (l.includes('error')||l.includes('traceback')||l.includes('exception')) return 'err';
  if (l.includes('✓')||l.includes('complete')||l.includes('winner')||l.includes('best:')||l.includes('done')) return 'ok';
  return '';
}

// ── Actions ───────────────────────────
function pick(id) {
  sel = id;
  logCursor[id] = 0;
  clearLogs();
  renderSteps();
  renderDet();
  // Load existing logs immediately
  pollLogs();
}

function stab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t===name));
  document.querySelectorAll('.tpane').forEach(t => t.classList.toggle('on', t.id===`tp-${name}`));
}

async function doRun(id) {
  try {
    const r = await fetch(`${API}/api/pipeline/run/${id}`, {method:'POST'});
    const d = await r.json();
    if (d.error) { alert(d.error); return; }
    logCursor[id] = 0;
    clearLogs();
    load();
  } catch(e) { alert(e.message); }
}

async function doStop() {
  try {
    await fetch(`${API}/api/pipeline/stop`, {method:'POST'});
    load();
  } catch(e) { alert(e.message); }
}

async function doReset(id) {
  if (!confirm(`Reset "${id}" to pending?`)) return;
  try {
    await fetch(`${API}/api/pipeline/reset/${id}`, {method:'POST'});
    load();
  } catch(e) { alert(e.message); }
}

// ── Agent status ──────────────────────
function updateAgent() {
  if (!data) return;
  const dot = document.getElementById('agentDot');
  const lbl = document.getElementById('agentLabel');
  const st = data.agent_status || 'unknown';
  const on = st === 'online';
  dot.classList.toggle('online', on);
  lbl.className = `agent-label ${on?'online':''}`;
  lbl.textContent = `agent: ${st}`;
}

// ── Helpers ───────────────────────────
function fmtDur(s) {
  if (s<60) return `${Math.round(s)}s`;
  if (s<3600) return `${Math.floor(s/60)}m ${Math.round(s%60)}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}
function esc(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// ── Init ──────────────────────────────
load();
setInterval(load, 5000);       // Refresh state every 5s
setInterval(pollLogs, 2000);   // Poll logs every 2s
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>

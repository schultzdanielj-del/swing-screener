<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;">

  <div class="swatch-block">
    <div style="height:56px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:0px;"></div>
    <div class="meta"><div class="name">0px</div><div class="hex" style="color:var(--fg-secondary)">--r-0</div><div class="sub">Tables, ticker tiles</div></div>
  </div>
  <div class="swatch-block">
    <div style="height:56px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:2px;"></div>
    <div class="meta"><div class="name">2px</div><div class="hex" style="color:var(--fg-secondary)">--r-1</div><div class="sub"></div></div>
  </div>
  <div class="swatch-block">
    <div style="height:56px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;"></div>
    <div class="meta"><div class="name">4px</div><div class="hex" style="color:var(--fg-secondary)">--r-2</div><div class="sub">Controls (default)</div></div>
  </div>
  <div class="swatch-block">
    <div style="height:56px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;"></div>
    <div class="meta"><div class="name">6px</div><div class="hex" style="color:var(--fg-secondary)">--r-3</div><div class="sub">Panels, modals</div></div>
  </div>
  <div class="swatch-block">
    <div style="height:56px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;"></div>
    <div class="meta"><div class="name">10px</div><div class="hex" style="color:var(--fg-secondary)">--r-4</div><div class="sub">Pills, avatars</div></div>
  </div>
</div></body></html>

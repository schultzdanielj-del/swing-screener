<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">

  <div class="swatch-block">
    <div style="height:54px;background:var(--bg-panel);border:1px solid #1a212b;border-radius:6px;"></div>
    <div class="meta">
      <div class="name">Faint</div>
      <div class="hex">#1a212b  ·  --border-faint</div>
      <div class="sub">Table inner dividers</div>
    </div>
  </div>
  <div class="swatch-block">
    <div style="height:54px;background:var(--bg-panel);border:1px solid #262e3a;border-radius:6px;"></div>
    <div class="meta">
      <div class="name">Default</div>
      <div class="hex">#262e3a  ·  --border</div>
      <div class="sub">Panels, inputs, buttons</div>
    </div>
  </div>
  <div class="swatch-block">
    <div style="height:54px;background:var(--bg-panel);border:1px solid #3a4453;border-radius:6px;"></div>
    <div class="meta">
      <div class="name">Strong</div>
      <div class="hex">#3a4453  ·  --border-strong</div>
      <div class="sub">Pressed / focused state</div>
    </div>
  </div>
</div></body></html>

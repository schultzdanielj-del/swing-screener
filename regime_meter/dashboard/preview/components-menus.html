<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
  <div style="background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.45);padding:4px;min-width:200px;">
    <div style="padding:6px 10px;font-size:11px;color:var(--fg-tertiary);text-transform:uppercase;letter-spacing:0.08em;">Actions</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12px;border-radius:3px;background:var(--bg-row-hover);"><span>Add to watchlist</span><span class="t-fn">⌘D</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12px;border-radius:3px;"><span>Open chart</span><span class="t-fn">↵</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12px;border-radius:3px;"><span>Set alert…</span><span class="t-fn">A</span></div>
    <div style="height:1px;background:var(--border-faint);margin:4px 0;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12px;border-radius:3px;color:var(--down);"><span>Remove</span><span class="t-fn">⌫</span></div>
  </div>
  <div style="background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.45);overflow:hidden;">
    <div style="padding:6px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">
      <span style="color:var(--fg-tertiary);font-family:var(--font-mono);">⌕</span>
      <span style="font-size:12px;color:var(--fg-tertiary);">Search ticker or function</span>
      <span class="t-fn" style="margin-left:auto;">ESC</span>
    </div>
    <div style="padding:4px;font-size:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:3px;background:var(--bg-row-hover);"><span class="mono">AAPL — Apple Inc.</span><span class="t-fn">EQ</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:3px;"><span class="mono">AMZN — Amazon.com</span><span class="t-fn">EQ</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:3px;"><span>EQS — Equity scanner</span><span class="t-fn">FN</span></div>
    </div>
  </div>
</div></body></html>

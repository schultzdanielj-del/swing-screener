<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:12px;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div style="background:var(--up-soft);border:1px solid var(--up);border-radius:4px;padding:10px 12px;">
      <div class="label up" style="margin-bottom:6px;">VOICE — ON</div>
      <div style="font-size:12px;line-height:1.5;color:var(--fg-primary);">Scan returned 47 matches. 12 above ADR avg.</div>
      <div style="font-size:12px;line-height:1.5;color:var(--fg-primary);margin-top:4px;">Stop set at 178.40. Risk: $312.</div>
    </div>
    <div style="background:var(--down-soft);border:1px solid var(--down);border-radius:4px;padding:10px 12px;">
      <div class="label down" style="margin-bottom:6px;">VOICE — OFF</div>
      <div style="font-size:12px;line-height:1.5;color:var(--fg-secondary);">🎉 Awesome! We found 47 great matches for you!</div>
      <div style="font-size:12px;line-height:1.5;color:var(--fg-secondary);margin-top:4px;">Looks like the market's a little choppy today!</div>
    </div>
  </div>
  <div class="sub">Terse · imperative · numbers-first · no emoji · sentence case</div>
</div></body></html>

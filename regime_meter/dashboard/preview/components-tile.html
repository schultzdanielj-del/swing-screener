<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-faint);border:1px solid var(--border-faint);">

  <div style="background:var(--bg-panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary);letter-spacing:0.04em;">SPY</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--fg-primary);">548.21</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--up);">+0.42%</div>
  </div>
  <div style="background:var(--bg-panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary);letter-spacing:0.04em;">QQQ</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--fg-primary);">472.18</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--up);">+0.88%</div>
  </div>
  <div style="background:var(--bg-panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary);letter-spacing:0.04em;">IWM</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--fg-primary);">198.04</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--down);">−0.61%</div>
  </div>
  <div style="background:var(--bg-panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary);letter-spacing:0.04em;">VIX</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--fg-primary);">14.82</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--down);">+3.20%</div>
  </div>
</div></body></html>

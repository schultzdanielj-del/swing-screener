<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:8px;">

  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">1</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">4px</span>
    <div style="width:4px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-1  ·  Tight row gap, icon-to-label</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">2</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">8px</span>
    <div style="width:8px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-2  ·  Form field inner padding</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">3</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">12px</span>
    <div style="width:12px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-3  ·  Panel inner padding</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">4</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">16px</span>
    <div style="width:16px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-4  ·  Card padding, between groups</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">5</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">20px</span>
    <div style="width:20px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-5</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">6</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">24px</span>
    <div style="width:24px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-6  ·  Section gap</span>
  </div>
  <div class="row" style="gap:14px;font-size:12px;">
    <span class="mono" style="width:32px;color:var(--fg-tertiary);">8</span>
    <span class="mono" style="width:36px;color:var(--fg-secondary);">32px</span>
    <div style="width:32px;height:14px;background:var(--accent);border-radius:2px;"></div>
    <span class="sub" style="margin-left:auto;">--sp-8</span>
  </div>
</div></body></html>

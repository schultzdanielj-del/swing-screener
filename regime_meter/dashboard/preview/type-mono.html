<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:10px;">
  <div class="row" style="gap:18px;">
    <span class="mono" style="font-size:36px;color:var(--up);font-weight:600;">184.27</span>

  <div style="height:1px;background:var(--border-faint);"></div>

    <thead><tr style="font-size:10px;color:var(--fg-secondary);text-transform:uppercase;letter-spacing:0.08em;">

      <tr><td style="padding:3px 8px 3px 0;">META</td><td style="text-align:right;padding:3px 8px;">512.04</td><td style="text-align:right;padding:3px 8px;color:var(--down);">−1.12%</td><td style="text-align:right;padding:3px 8px;color:var(--fg-secondary);">18.7M</td><td style="text-align:right;padding:3px 0 3px 8px;">0.88</td></tr>

    </tbody>
  </table>
</div></body></html>

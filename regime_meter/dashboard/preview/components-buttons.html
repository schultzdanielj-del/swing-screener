<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:14px;">
  <div class="row" style="gap:10px;flex-wrap:wrap;">
    <button style="background:var(--accent);color:var(--fg-on-accent);border:1px solid var(--accent);padding:6px 12px;font-family:var(--font-sans);font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;">Run scan</button>
    <button style="background:var(--bg-elevated);color:var(--fg-primary);border:1px solid var(--border);padding:6px 12px;font-family:var(--font-sans);font-size:12px;font-weight:500;border-radius:4px;cursor:pointer;">Save preset</button>
    <button style="background:transparent;color:var(--fg-secondary);border:1px solid transparent;padding:6px 12px;font-family:var(--font-sans);font-size:12px;font-weight:500;border-radius:4px;cursor:pointer;">Cancel</button>
    <button style="background:transparent;color:var(--down);border:1px solid var(--border);padding:6px 12px;font-family:var(--font-sans);font-size:12px;font-weight:500;border-radius:4px;cursor:pointer;">Close position</button>
    <button style="background:var(--bg-elevated);color:var(--fg-tertiary);border:1px solid var(--border);padding:6px 12px;font-family:var(--font-sans);font-size:12px;font-weight:500;border-radius:4px;opacity:0.4;cursor:not-allowed;">Disabled</button>
  </div>
  <div class="row" style="gap:10px;">
    <span class="label" style="width:84px;">Sizes</span>
    <button style="background:var(--bg-elevated);color:var(--fg-primary);border:1px solid var(--border);padding:3px 8px;font-family:var(--font-sans);font-size:11px;border-radius:3px;">XS</button>
    <button style="background:var(--bg-elevated);color:var(--fg-primary);border:1px solid var(--border);padding:5px 10px;font-family:var(--font-sans);font-size:12px;border-radius:4px;">SM</button>
    <button style="background:var(--bg-elevated);color:var(--fg-primary);border:1px solid var(--border);padding:8px 14px;font-family:var(--font-sans);font-size:13px;border-radius:4px;">MD</button>
  </div>
  <div class="row" style="gap:10px;">
    <span class="label" style="width:84px;">Icon-only</span>
    <button style="background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border);width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;">+</button>
    <button style="background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border);width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;">⋯</button>
    <button style="background:var(--bg-elevated);color:var(--fg-secondary);border:1px solid var(--border);width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;">✕</button>
  </div>
</div></body></html>

<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: var(--bg-canvas); }
  body { padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .sub { font-size: 11px; color: var(--fg-tertiary); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .swatch { border-radius: 6px; border: 1px solid var(--border); }
  .swatch-block { display: flex; flex-direction: column; gap: 6px; }
  .swatch-block .meta { display: flex; flex-direction: column; gap: 2px; }
  .swatch-block .name { font-size: 12px; color: var(--fg-primary); }
  .swatch-block .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); }
</style>
</head><body>
<div class="col" style="gap:8px;">
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">36</span><span style="font-size:36px;font-weight:600;letter-spacing:-0.02em;">Scan complete</span></div>
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">28</span><span style="font-size:28px;font-weight:600;letter-spacing:-0.015em;">47 matches found</span></div>
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">22</span><span style="font-size:22px;font-weight:600;letter-spacing:-0.01em;">Open positions</span></div>
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">18</span><span style="font-size:18px;font-weight:600;">Top of book</span></div>
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">13</span><span style="font-size:13px;">Default body text — Geist Sans, 13px, 1.45 line-height</span></div>
  <div style="display:flex;align-items:baseline;gap:12px;"><span class="label" style="width:48px;">11</span><span class="t-panel-title">PANEL TITLE STRIP</span></div>
</div></body></html>
